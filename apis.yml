- aid: silverflow:silverflow-documents-api
  name: Silverflow Documents API
  description: >-
    A Document is a file with associated metadata that can be uploaded and downloaded. Documents have
    to be attached to a business entity, for example `Dispute Documents`. The Document upload process
    starts with creating metadata information, see [Add Dispute Document](#operation/addDisputeDocumentsMetadata).
    New Documents will be created with status `pending`.


    Adding a Document returns a key which can be used to upload the file using [Upload Document](#operation/uploadDocumentFile).
    Once the file is successfully updated, the status will be changed to `active`.


    The maximum size for a Document is 10MB and the maximum combined size of all documents uploaded for
    a Dispute is 14.5MB.


    Supported MIME types:

    -   image/jpeg

    -   application/pdf

    -   image/tiff

    acceptors, enrollments, screenings), 3-D Secure and BEP authentication, processor
    and network tokenization, charge creation (standard, recurring/MIT, funding, payout,
    POS, ATM), charge actions (increment, reverse, cancel, refund, offline refund,
    manual clearing), disputes and documents, fraud notifications, card info, currency
    conversion rates, interchange and scheme fee estimation, transaction risk assessment,
    reconciliation details, network funds transfers, report generation and scheduling,
    distributions and file subscriptions.'

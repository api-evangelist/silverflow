aid: silverflow
name: Silverflow
description: 'Silverflow is an Amsterdam-based cloud-native card processing platform
  that connects acquirers, payment service providers, payment facilitators and merchants
  directly to the card networks (Visa, Mastercard, Amex, Discover, Diners, Maestro,
  Bancontact) through a single REST API. Founded in 2019, the company replaces legacy
  acquiring processor infrastructure with a contract-first, OpenAPI 3.0-described
  platform covering merchant and acceptor onboarding, 3-D Secure and BEP authentication,
  processor and network tokenization, authorization, clearing and settlement, incremental
  authorizations, reversals, refunds and payouts, terminal-to-cloud POS charges, ATM
  card management, dispute and chargeback handling, fraud notifications, transaction
  risk assessment, interchange and scheme-fee estimation, and a full reconciliation
  and reporting suite. The Silverflow API exposes 137 operations across 101 paths,
  emits 31 CloudEvents 1.0 webhook notifications through an event-subscription surface,
  and publishes a sandbox with amount-driven authorization test scenarios.'
url: https://raw.githubusercontent.com/api-evangelist/silverflow/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
deliveryModel:
  model: saas
  open_source: false
  commercial: true

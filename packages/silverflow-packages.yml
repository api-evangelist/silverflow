consequence_note: >-
  With no SDK, no CLI and a spec marked unsuitable for code generation, every Silverflow
  integration is hand-written against the raw HTTP contract. For an agent this is actually a
  clean surface — one well-specified REST API, no version skew between an SDK and the API — but
  it means there is no first-party abandonment signal to read here, in either direction. The
  freshness evidence for this provider is the changelog instead: 398 dated releases, the most
  recent 2026-08-25, two days before this pass.

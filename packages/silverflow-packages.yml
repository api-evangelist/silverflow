distribution_model:
  spec_download: https://docs.silverflow.com/apidocs/latest/openapi.yml
  spec_download_note: >-
    The OpenAPI is the deliverable. The docs Introduction explicitly points integrators at it —
    "Use the Download button at the top of the page to download the API definition" — and
    suggests importing it into Postman to bootstrap a collection.
  postman:
    official_collection_published: false
    note: >-
      Silverflow RECOMMENDS Postman and links Postman's own OpenAPI-import documentation, but
      publishes no public Postman collection or workspace of its own. No Postman pointer was

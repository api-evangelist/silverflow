finding: >-
  Silverflow publishes NO first-party client libraries in any package registry, and no SDK,
  CLI or code-sample repository anywhere public. This is a deliberate posture, not an oversight:
  the OpenAPI's own info.description states "This OpenAPI specification cannot be used for code
  generation. Please reach out to your TAM regarding code generation using the API Spec." — so
  Silverflow routes client generation through its technical account managers rather than
  shipping or supporting generated clients.

candidate_note: >-
  The tools below are derived one-to-one from real Silverflow operationIds in
  openapi/silverflow-openapi.yml. Each tool's real inputSchema is the backing operation's
  parameters + requestBody; the binding is recorded in mcp/silverflow-tool-crosswalk.yml.
  Selection is deliberately conservative — read-heavy and pre-flight operations first, with
  every money-moving write flagged for confirmation, because this API authorizes card payments.
safety_posture:
  irreversible_after_clearing: [createCharge, createChargeMit, createChargePayout, triggerManualClearing]
  one_way_doors: [acceptDispute, deleteApiKey]
  require_idempotency_key: >-
    Every tool bound to one of the 19 idempotent operations must send an Idempotency-Key and
    must serialise the request body with stable key ordering — see
    conventions/silverflow-conventions.yml idempotency.scope.
  confirmation_recommended: >-
    Any tool that creates a charge, clears, refunds, reverses, cancels, or accepts a dispute
    should require explicit human confirmation. See conventions reversibility.

    The examples have also been updated to reflect this change.'
- version: 1.370.0
  date: '2026-04-02'
  changes:
  - 'Deprecation: From 23 August, 2026 in the `BepSuccessReponse` of the `GET /v1/bep/{bepKey}` endpoint,
    the field `bepaf` will not always return the entire BEPAF value. Instead, once 45 days have passed
    since the BEP authentication was created, we will only return the part of the BEPAF value that is
    required for WIP transactions.'
  - 'The `billingAddress.countryCode`, `billingAddress.city`, and `billiingAddress.line1` fields are no
    longer required for requests to endpoints:'
  - 'The `billingAddress.countryCode`, `billingAddress.city`, and `billiingAddress.line1` fields are no
    longer required in the response of endpoints:'

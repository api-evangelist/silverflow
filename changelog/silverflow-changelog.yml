- version: 1.333.0
  date: '2025-12-03'
  changes:
  - 'Breaking: Added card network validation for the merchant acceptor to the `POST /v1/bep` endpoint.
    A merchant acceptor that has a bin with a card network other than `bancontact` will now result in
    a 409 error with `type` of `/silverflow/problems/bin/unexpected-network`.'
  - Added documentation for 409 error with `type` of `/silverflow/problems/referenced-entity-not-found`,
    which was previously undocumented on the `POST /v1/bep` endpoint.
- version: 1.332.1
  date: '2025-11-26'
  changes:
  - 'Breaking: Charges authorized more than 6 months ago can no longer be cleared with the `POST /v1/charges/{chargeKey}/clear`
    endpoint.'
  - 'Breaking: The `clearAfter` property can no longer be set to values more than 6 months in the future
    on the following endpoints:'
- version: 1.331.0
  date: '2025-11-10'
  changes:
  - 'Breaking: For all Charges endpoints the error with `type` of `/silverflow/problems/idempotency/request-is-still-being-processed`
    now has a 409 status code instead of 503.'
  - 'Breaking: For all Charges endpoints the error with `type` of `/silverflow/problems/idempotency/request-body-mismatch`
    has been renamed to `/silverflow/problems/idempotency/request-mismatch`.'
  - 'Fixed the documentation for the error with `type` of `/silverflow/problems/invalid-input`. The field
    `validationErrors[].instancePath` has been corrected to `validationErrors[].path`. This affects the
    following endpoints:'
- version: 1.329.0
  date: '2025-11-04'
  changes:
  - 'Breaking: The `POST /v1/charges/{chargeKey}/clear` endpoint can be called at most 6 months after
    the charge was created.'
- version: 1.325.0
  date: '2025-10-28'
  changes:
  - 'Breaking: Removed the deprecated `acquirerId` field in MATCH Screening responses on all Screening
    endpoints.'
  - 'Breaking: Removed the deprecated `acquirerBID` field in VMSS Screening requests and responses on
    all Screening endpoints.'

  - 'Deprecation: From May 4, 2026, the `fraudLiability` field will be optional for payout charges in
    the responses on the `GET /v1/charges/{chargeKey}` and `GET /v1/charges` endpoints.'
  - 'Deprecation: From May 4, 2026, when using `clearingMode` `auto` the `clearAfter` field will have

schema_note: >-
  1752 component schemas for 137 operations is an unusually high ratio. It is driven by the
  per-network discriminated unions (each of visa / mastercard / american-express / discover /
  diners / bancontact / unknown gets its own ISO-field schema, repeated per action type) and by
  per-error *ErrorDetails schemas. There is also visible schema-name collision debt from spec
  assembly — names such as `schemas-EntityNotFoundErrorDetails`,
  `components-schemas-ForbiddenError` and `openapi_components-schemas-InvalidInputErrorDetails`
  are mangled duplicates of their unprefixed siblings, which suggests the published document is
  merged from several source specs. Worth reporting to Silverflow: it makes generated client
  models noisy and is the likely reason the spec is marked as not suitable for code generation.

core_hierarchy:
  summary: >-
    Agent -> Merchant -> MerchantAcceptor is the spine. An Agent is the API tenant (the
    acquirer, PSP or payfac holding the credentials). A Merchant is a legal entity. A
    MerchantAcceptor is the TECHNICAL configuration that binds that merchant to a BIN for
    network connectivity — the distinction Silverflow's own llms.txt calls out first:
    "Merchants represent legal entities; acceptors are technical configurations for network
    connectivity (BIN-based)." Every charge is created against an acceptor, not against a
    merchant.
  note: >-
    MerchantAcceptor is VERSIONED — it has a draft version that is edited and then activated
    (getDraftAcceptorVersion, activateAcceptor, getAcceptorVersion), which is why a bad
    acceptor change is superseded rather than rolled back.

identifier_scheme:
  style: typed, prefixed, opaque, immutable string keys
  form: <prefix>-<base62>
  note: >-
    Every top-level resource carries a `key` property whose prefix names its type, so a bare
    identifier is self-describing anywhere it appears. This is the single most useful property
    of the model for an agent — a key found in an event payload can be routed to the right
    endpoint without any surrounding context.

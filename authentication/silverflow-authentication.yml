schemes:
- name: ApiKey
  type: http
  scheme: basic
  description: 'The primary method of authenticating to the Silverflow API is through API keys.


    API keys can be created by calling the [createApiKey](#operation/createApiKey) endpoint. You can create
    up to 40 API keys and also update and delete them, allowing for _credential rotation_.


    The _Agent Activation_ process will generate an initial API Key for you. See [Activate Agent](#section/Getting-Started).


    A cal'
  sources:
  - openapi/silverflow-openapi.yml
  primary: true
  summary: HTTP Basic where username = API key `key` (prefix apk-) and password = the key `secret`.
  credential_lifecycle: Created with POST /v1/apiKeys (createApiKey); up to 40 keys per agent; updatable
    and deletable, which is how credential rotation is done. The `secret` is returned ONCE, at creation,
    and is never retrievable again.
  bootstrap: The Agent Activation process (POST /v1/agents/{agentKey}/activate) mints the first API key
    from an Agent Activation Token issued during onboarding.
  rfc: RFC 7617
  scoping:
    permissions: Each key carries an explicit permission list (e.g. charges:List, reports:All). A call
      lacking the permission returns 403 whose detail names the permission needed. Least privilege is
      documented as the recommended practice.
    permission_reference: https://docs.silverflow.com/apidocs/latest/index.html#tag/API-Keys/operation/createApiKey
    ip_restrictions: Keys can be pinned to CIDR ranges (e.g. 185.184.111.39/32, 102.177.115.120/29, 0.0.0.0/0).
      Use outside the range returns a generic 401 Authentication Required rather than a distinguishing
      error.

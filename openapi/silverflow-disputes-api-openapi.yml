    schemas-chargeKey:
      description: Uniquely identifies a charge.
      type: string
      pattern: ^chg-[a-zA-Z0-9]+$
      minLength: 1
      maxLength: 120
      readOnly: false
      example: chg-1e1dAHhgstYTUhlphPzZ
    eventDate:
      description: Datetime of an action mentioned in the history record. (e.g. dispute acceptance date)
      format: date-time
      readOnly: false
      example: '2021-05-27T10:57:52Z'
    schema:
      type: string
      enum:
      - issuer
      - acquirer
      - card-network
    disputeKey:
      description: Uniquely identifies a Dispute.
      type: string
      pattern: ^dsp-[a-zA-Z0-9]+$
      minLength: 1
      maxLength: 120
      readOnly: false
      example: dsp-1JRadf2ffdfrdPMf2XrS2
    DisputeCategory:
      type: string
      enum:
      - Fraud
      - Authorization
      - Processing Error
      - Cardholder Disputes
      - PreChargeback
      - Retrieval Chargeback
      readOnly: false
    chargeInfo:
      description: Charge related information
      type: object
      required:
      - arn
      - amount
      - fraudLiability
      properties:
        networkReference:
          $ref: '#/components/schemas/networkReference'
        arn:
          $ref: '#/components/schemas/acquirerReferenceNumber'
        localTransactionDateTime:
          $ref: '#/components/schemas/schemas-localTransactionDateTime'
        amount:
          $ref: '#/components/schemas/openapi_components-schemas-Amount'
        chargeKey:
          $ref: '#/components/schemas/schemas-chargeKey'
        transactionReference:
          $ref: '#/components/schemas/schemas-transactionReference'
        fraudLiability:
          $ref: '#/components/schemas/schemas-fraudLiability'
        clearingDateTime:
          $ref: '#/components/schemas/clearingDateTime'
        crn:
          $ref: '#/components/schemas/clearingReferenceNumber'
    lastEventDate:
      description: The datetime of the last event in card network.
      type: string
      format: date
      example: '2019-08-24T14:15:11'
    schemas-last4:
      type: string
      deprecated: true
      description: The last 4 digits of the card. **This property will be removed on 24 September 2025. Use `maskedNumber` instead.**
      readOnly: false
      pattern: ^\d+$
      minLength: 4
      maxLength: 4
      example: 0905
    messageText:
      type: string
      description: 'This field is passed on to element DE72 (Data Record) in the second presentment

        clearing file. Mastercard chargeback rules prescribe how to fill this field depending on the type of representment.

        Please refer to the Mastercard chargeback manual for more information.

        '
      pattern: ^[\w +-=.,:;!?$@()]+$
      minLength: 1
      maxLength: 100
    DisputeDefense:
      oneOf:
      - $ref: '#/components/schemas/DefendMastercardCollaboration'
      - $ref: '#/components/schemas/DefendVisaChargeback'
      - $ref: '#/components/schemas/DefendMastercardChargeback'
      - $ref: '#/components/schemas/DefendMastercardPreArbitration'
      - $ref: '#/components/schemas/DefendVisaPreArbitration'
      - $ref: '#/components/schemas/DefendAmexRFI'
      - $ref: '#/components/schemas/DefendAmexChargeback'
    actionDueDate:
      type: string
      description: Due date for the next action in "YYYY-MM-DD" format.
      format: date
      example: '2021-05-27'
    defenseOptions:
      description: Represents the possible defense options when the Dispute is in a defendable status.
      type: array
      additionalProperties: false
      items:
        $ref: '#/components/schemas/defenseOption'

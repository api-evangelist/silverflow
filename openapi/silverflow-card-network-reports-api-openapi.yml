openapi: 3.2.0
info:
  title: Silverflow Card Network Reports API
  version: 1.417.0
  contact:
    name: API Support
    email: support@silverflow.com
  license:
    name: Commercial
  description: 'Operations tagged Card Network Reports across 2 of this provider''s published API definitions: silverflow-openapi.yml, silverflow-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://eu-west-1.api.silverflow.com/v1
  description: Production URL for Europe - Equivalent to https://api.silverflow.co/v1
- url: https://us-east-2.api.silverflow.com/v1
  description: Production URL for North America
- url: https://eu-west-1.api-sbx.silverflow.com/v1
  description: Sandbox URL - Equivalent to https://api-sbx.silverflow.co/v1
security:
- ApiKey: []
- BearerToken: []
tags:
- name: Card Network Reports
paths:
  /reports/ammfReport:
    post:
      operationId: createAmmfReport
      summary: Create AMMF Report
      description: 'Schedules the creation of an AMMF Report.


        Requires the `reports:Create` permission to **create** the report, but for downloading the report you need the `reports:DownloadAmmfReport` permission.

        '
      tags:
      - Card Network Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAmmfReportRequest'
            examples:
              AmmfReportExample:
                $ref: '#/components/examples/CreateAmmfReportRequest'
      responses:
        '201':
          description: The scheduled AMMF Report
          headers:
            Location:
              description: The URL of the newly created AMMF Report
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAmmfReportResponse'
              examples:
                AmmfReportExample:
                  $ref: '#/components/examples/CreateAmmfReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InvalidDateRangeErrorDetails'
                - $ref: '#/components/schemas/InvalidReportNameErrorDetails'
                - $ref: '#/components/schemas/InputValidationError'
              examples:
                InvalidDateRange:
                  $ref: '#/components/examples/InvalidDateRangeError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedErrorDetails'
              example:
                type: /silverflow/problems/report/not-authorized
                title: Not authorized
                status: 401
                detail: The agent is not authorized to perform this action
                instance: /silverflow/8e445b2e-d745-4b38-a38d-781fc998e442
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-3'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-3'
    servers:
    - url: https://eu-west-1.api.silverflow.com/v1
      description: Production URL for Europe - Equivalent to https://api.silverflow.co/v1
    - url: https://us-east-2.api.silverflow.com/v1
      description: Production URL for North America
    - url: https://eu-west-1.api-sbx.silverflow.com/v1
      description: Sandbox URL - Equivalent to https://api-sbx.silverflow.co/v1
  /reports/quarterlySchemeReport:
    post:
      operationId: createQuarterlySchemeReport
      summary: Create Quarterly Scheme Report
      description: 'Schedules the creation of a Quarterly Scheme Report by acquirer and card scheme.


        Reports can only be created for quarters that ended within the last 2 years.


        Requires the `reports:Create` permission to **create** the report, but for downloading the report you need the `reports:DownloadQuarterlySchemeReport` permission.

        '
      tags:
      - Card Network Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/VisaQuarterlySchemeReportRequest'
              - $ref: '#/components/schemas/MastercardQuarterlySchemeReportRequest'
            examples:
              VisaQuarterlySchemeReport:
                $ref: '#/components/examples/VisaQuarterlySchemeReportRequest'
              MastercardQuarterlySchemeReport:
                $ref: '#/components/examples/MastercardQuarterlySchemeReportRequest'
      responses:
        '201':
          description: The scheduled Quarterly Scheme Report
          headers:
            Location:
              description: The URL of the newly created Quarterly Scheme Report
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/VisaQuarterlySchemeReportResponse'
                - $ref: '#/components/schemas/MastercardQuarterlySchemeReportResponse'
              examples:
                VisaQuarterlySchemeReport:
                  $ref: '#/components/examples/VisaQuarterlySchemeReportResponse'
                MastercardQuarterlySchemeReport:
                  $ref: '#/components/examples/MastercardQuarterlySchemeReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InvalidDateRangeErrorDetails'
                - $ref: '#/components/schemas/InvalidReportNameErrorDetails'
                - $ref: '#/components/schemas/InputValidationError'
              examples:
                InvalidDateRange:
                  $ref: '#/components/examples/InvalidDateRangeError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedErrorDetails'
              example:
                type: /silverflow/problems/report/not-authorized
                title: Not authorized
                status: 401
                detail: The agent is not authorized to perform this action
                instance: /silverflow/8e445b2e-d745-4b38-a38d-781fc998e442
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-3'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-3'
    servers:
    - url: https://eu-west-1.api.silverflow.com/v1
      description: Production URL for Europe - Equivalent to https://api.silverflow.co/v1
    - url: https://us-east-2.api.silverflow.com/v1
      description: Production URL for North America
    - url: https://eu-west-1.api-sbx.silverflow.com/v1
      description: Sandbox URL - Equivalent to https://api-sbx.silverflow.co/v1
components:
  examples:
    MastercardQuarterlySchemeReportResponse:
      value:
        reportName: MastercardQuarterlySchemeReport
        parameters:
          network: mastercard
          acquirerIdCode: '123456'
          year: 2024
          quarter: 1
          currency: USD
        mimeType: application/vnd.ms-excel
        key: rep-1e1dAHhgstYTUhlphPzZ
        agentKey: cgt-1e1dAHhgstYTUhlphPzZ
        reference: Report Reference
        status: scheduled
        created: '2024-01-01T12:00:00Z'
        distributions:
        - dst-1e1dAHhgstYTUhlphPzZ
    VisaQuarterlySchemeReportResponse:
      value:
        reportName: VisaQuarterlySchemeReport
        parameters:
          network: visa
          bid: '123456'
          year: 2024
          quarter: 1
          currency: USD
        mimeType: application/vnd.ms-excel
        key: rep-1e1dAHhgstYTUhlphPzZ
        agentKey: cgt-1e1dAHhgstYTUhlphPzZ
        reference: Report Reference
        status: scheduled
        created: '2024-01-01T12:00:00Z'
        distributions:
        - dst-1e1dAHhgstYTUhlphPzZ
    VisaQuarterlySchemeReportRequest:
      value:
        parameters:
          network: visa
          bid: '123456'
          year: 2024
          quarter: 1
          currency: USD
        reference: report reference
        mimeType: application/vnd.ms-excel
    MastercardQuarterlySchemeReportRequest:
      value:
        parameters:
          network: mastercard
          acquirerIdCode: '123456'
          year: 2024
          quarter: 1
          currency: USD
        reference: report reference
        mimeType: application/vnd.ms-excel
    CreateAmmfReportRequest:
      value:
        parameters:
          date: '2024-07-29'
          acquirerIdCode: '123456'
          directSubmission: false
        mimeType: application/vnd.ms-excel
        reference: AMMF-REPORT-20240729-001
        distributions:
        - dst-3e1dAHhgstYTUhlphPzZ
    InvalidDateRangeError:
      summary: Invalid Date Range Error
      value:
        type: /silverflow/problems/report/invalid-date-range
        title: Invalid date range
        status: 400
        detail: 'Invalid date range: 2019-08-25T14:15:22Z - 2019-08-24T14:15:22Z'
        instance: /silverflow/b4cc37a0-ab24-46b4-aa8c-cc2d6eddf1b6
    CreateAmmfReportResponse:
      value:
        key: rep-2a1dAHhgstYTUhlphPzZ
        reportName: AmmfReport
        parameters:
          date: '2024-07-29'
          acquirerIdCode: '123456'
          directSubmission: false
        mimeType: application/vnd.ms-excel
        reference: AMMF-REPORT-20240729-001
        agentKey: cgt-1UF2NafdfrdPMf2XrS2
        status: scheduled
        created: '2019-08-24T14:15:22Z'
        distributions:
        - dst-1e1dAHhgstYTUhlphPzZ
  schemas:
    openapi_components-schemas-ValidationError:
      type: object
      required:
      - path
      - errorCode
      - message
      properties:
        path:
          type: string
          description: The path to the error location in the request params or body.
        errorCode:
          type: string
          description: The error code identifying the error type.
        message:
          type: string
          description: The error message.
    VisaQuarterlySchemeReportRequest:
      type: object
      required:
      - parameters
      - mimeType
      additionalProperties: false
      properties:
        parameters:
          $ref: '#/components/schemas/VisaQuarterlySchemeReportParameters'
        reference:
          $ref: '#/components/schemas/quarterly-scheme-report_reference'
        mimeType:
          $ref: '#/components/schemas/quarterlySchemeReportMimeType'
        distributions:
          $ref: '#/components/schemas/distributions'
    errorTitle:
      type: string
      description: 'A short, human-readable summary of the problem type. It does not change from occurrence to occurrence of the error.

        '
    ammfDirectSubmission:
      type: boolean
      description: set to `true` to indicate that the AMMF report should be directly submitted to Visa's AMMF service
    ammfAcquirerIdCode:
      type: string
      description: the Acquirer Institution ID. For Visa, this is the BIC. It should be a 6-digit numeric value.
      pattern: ^\d{6}$
    year:
      type: integer
      description: The year for which the report is being generated. It should be a four-digit number (e.g., 2023).
    errorInstance:
      type: string
      description: 'A reference that identifies the specific occurrence of the error. The instance is unique for every error.

        '
    components-schemas-reference:
      type: string
      description: Unique ID used to identify a report.
      maxLength: 120
    errorStatus:
      type: integer
      format: int32
      description: 'The HTTP status code generated by the origin server for this occurrence

        of the problem.

        '
    currency:
      type: string
      description: Specifies the currency in which the report will be generated.
      enum:
      - USD
      - EUR
      - SGD
      - GBP
      - PLN
      - THB
      - MYR
      - SEK
    AMMFReportParameters:
      type: object
      description: The parameters used for the AMMF Report.
      required:
      - date
      - acquirerIdCode
      additionalProperties: false
      properties:
        acquirerIdCode:
          $ref: '#/components/schemas/ammfAcquirerIdCode'
        date:
          type: string
          format: date
          description: 'The end date of the AMMF reporting period. The report covers the one-month period ending on this date.

            We recommend using a date in the past to ensure all data for the period has been written.

            '
        directSubmission:
          $ref: '#/components/schemas/ammfDirectSubmission'
    quarterly-scheme-report_reference:
      type: string
      description: Unique ID used to identify a quarterly scheme report.
      maxLength: 120
    InputValidationError:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - validationErrors
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/invalid-input
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Invalid Input
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 400
        detail:
          allOf:
          - $ref: '#/components/schemas/errorDetail'
          - enum:
            - The request does not adhere to the defined API schema.
        instance:
          $ref: '#/components/schemas/errorInstance'
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/openapi_components-schemas-ValidationError'
          description: A list of validation errors.
    quarter:
      type: integer
      description: Specifies the quarter of the year for the report. Valid values are 1 (Q1), 2 (Q2), 3 (Q3), and 4 (Q4).
      enum:
      - 1
      - 2
      - 3
      - 4
    distributionKey:
      description: Uniquely identifies a distribution object
      type: string
      pattern: ^dst-[a-zA-Z0-9]+$
      minLength: 10
      maxLength: 120
      example: dst-1e1dAHhgstYTUhlphPzZ
    VisaQuarterlySchemeReportResponse:
      type: object
      required:
      - reportName
      - parameters
      - mimeType
      - key
      - agentKey
      - status
      - created
      properties:
        reportName:
          type: string
          enum:
          - VisaQuarterlySchemeReport
        parameters:
          $ref: '#/components/schemas/VisaQuarterlySchemeReportParameters'
        mimeType:
          $ref: '#/components/schemas/quarterlySchemeReportMimeType'
        key:
          $ref: '#/components/schemas/reportKey'
        agentKey:
          $ref: '#/components/schemas/AgentKey'
        reference:
          $ref: '#/components/schemas/quarterly-scheme-report_reference'
        status:
          $ref: '#/components/schemas/createReportStatus'
        created:
          $ref: '#/components/schemas/openapi_components-schemas-created-2'
        distributions:
          $ref: '#/components/schemas/distributions'
    errorDetail:
      type: string
      description: 'A human readable explanation specific to this occurrence of the problem.

        '
    InvalidDateRangeErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/report/invalid-date-range
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Invalid date range
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 400
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    NotAuthorizedErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/report/not-authorized
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Not authorized
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 401
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    quarterlySchemeReportMimeType:
      type: string
      description: The mime-type in which the Quarterly Scheme Report is available.
      enum:
      - application/vnd.ms-excel
    AgentKey:
      description: Uniquely identifies an Agent
      type: string
      pattern: ^cgt-[a-zA-Z0-9]+|current$
      readOnly: true
      example: cgt-1UF2NafdfrdPMf2XrS2
    MastercardQuarterlySchemeReportResponse:
      type: object
      required:
      - reportName
      - parameters
      - mimeType
      - key
      - agentKey
      - status
      - created
      properties:
        reportName:
          type: string
          enum:
          - MastercardQuarterlySchemeReport
        parameters:
          $ref: '#/components/schemas/MastercardQuarterlySchemeReportParameters'
        mimeType:
          $ref: '#/components/schemas/quarterlySchemeReportMimeType'
        key:
          $ref: '#/components/schemas/reportKey'
        agentKey:
          $ref: '#/components/schemas/AgentKey'
        reference:
          $ref: '#/components/schemas/quarterly-scheme-report_reference'
        status:
          $ref: '#/components/schemas/createReportStatus'
        created:
          $ref: '#/components/schemas/openapi_components-schemas-created-2'
        distributions:
          $ref: '#/components/schemas/distributions'
    ammfReportMimeType:
      type: string
      description: The mime-type in which the AMMF Report is available.
      enum:
      - application/vnd.ms-excel
    openapi_components-schemas-ProblemDetail-2:
      type: object
      description: 'The ''problem detail'' object relays detailed information about the error that occurred. It is defined

        by [RFC 7807 - Problem Details for HTTP APIs](https://tools.ietf.org/html/rfc7807).


        Note that additional properties may be used to relay error specific information. For instance,

        A Bad Request error may hold information about the individual validation errors found in the request.

        '
      properties:
        type:
          type: string
          description: 'An absolute URI that identifies the problem type.

            '
          default: about:blank
          example: https://api.silverflow.co/problem/constraint-violation
        title:
          type: string
          description: 'A short, summary of the problem type. Written in english and readable

            for engineers (usually not suited for non technical stakeholders and

            not localized);

            '
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: 'The HTTP status code generated by the origin server for this occurrence

            of the problem.

            '
          minimum: 100
          maximum: 599
          example: 503
        detail:
          type: string
          description: 'A human readable explanation specific to this occurrence of the

            problem.

            '
          example: Connection to database timed out
        instance:
          type: string
          description: 'An absolute URI that identifies the specific occurrence of the problem.

            It may or may not yield further information if dereferenced.

            '
      additionalProperties: true
      example:
        type: https://api.silverflow.co/problem/bad-request
        title: Bad Request
        status: 400
        detail: The request could not be processed as it contained an invalid request entity
        instance: https://api.silverflow.co/v1/reports/rep-1hPdFqhgstYTUhlphPDp
        validationErrors:
        - The value of property 'status' should be one of 'idle', 'active' or 'archived'
        - The value of property 'tags.0.businessId' must not be longer than 255 characters
    createReportStatus:
      description: The status of the report.
      type: string
      enum:
      - scheduled
    CreateAmmfReportRequest:
      type: object
      required:
      - parameters
      - mimeType
      additionalProperties: false
      properties:
        parameters:
          $ref: '#/components/schemas/AMMFReportParameters'
        reference:
          $ref: '#/components/schemas/components-schemas-reference'
        mimeType:
          $ref: '#/components/schemas/ammfReportMimeType'
        distributions:
          $ref: '#/components/schemas/distributions'
    errorType:
      type: string
      description: 'A relative URI reference, this property can be used to perform automated error handling.

        '
    MastercardQuarterlySchemeReportRequest:
      type: object
      required:
      - parameters
      - mimeType
      additionalProperties: false
      properties:
        parameters:
          $ref: '#/components/schemas/MastercardQuarterlySchemeReportParameters'
        reference:
          $ref: '#/components/schemas/quarterly-scheme-report_reference'
        mimeType:
          $ref: '#/components/schemas/quarterlySchemeReportMimeType'
        distributions:
          $ref: '#/components/schemas/distributions'
    MastercardQuarterlySchemeReportParameters:
      type: object
      description: The parameters used for the MastercardQuarterlySchemeReport.
      required:
      - network
      - acquirerIdCode
      - year
      - quarter
      - currency
      additionalProperties: false
      properties:
        network:
          type: string
          description: The card network.
          enum:
          - mastercard
        acquirerIdCode:
          type: string
          description: The Acquirer Institution ID code. For Mastercard, this is the Acquirer ICA (Interbank Card Association) code, which is a unique identifier for the acquirer. It should be a 6-digit numeric value.
          pattern: ^\d{6}$
        quarter:
          $ref: '#/components/schemas/quarter'
        year:
          $ref: '#/components/schemas/year'
        currency:
          $ref: '#/components/schemas/currency'
    CreateAmmfReportResponse:
      type: object
      required:
      - reportName
      - parameters
      - mimeType
      - key
      - agentKey
      - status
      - created
      properties:
        reportName:
          type: string
          enum:
          - AmmfReport
        parameters:
          $ref: '#/components/schemas/AMMFReportParameters'
        mimeType:
          $ref: '#/components/schemas/ammfReportMimeType'
        key:
          $ref: '#/components/schemas/reportKey'
        agentKey:
          $ref: '#/components/schemas/AgentKey'
        reference:
          $ref: '#/components/schemas/components-schemas-reference'
        status:
          $ref: '#/components/schemas/createReportStatus'
        created:
          $ref: '#/components/schemas/openapi_components-schemas-created-2'
        distributions:
          $ref: '#/components/schemas/distributions'
    distributions:
      description: 'The distribution objects'' keys.


        If passed, the report will be distributed when generation is completed.

        '
      type: array
      items:
        $ref: '#/components/schemas/distributionKey'
    reportKey:
      description: Uniquely identifies a report object
      type: string
      pattern: ^rep-[a-zA-Z0-9]+$
      minLength: 10
      maxLength: 120
      example: rep-1e1dAHhgstYTUhlphPzZ
    InvalidReportNameErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/report/invalid-report-name
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Invalid report name
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 400
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    openapi_components-schemas-created-2:
      type: string
      description: The date and time this object was created
      format: date-time
      readOnly: true
    VisaQuarterlySchemeReportParameters:
      type: object
      description: The parameters used for the VisaQuarterlySchemeReport.
      required:
      - network
      - bid
      - year
      - quarter
      - currency
      additionalProperties: false
      properties:
        network:
          type: string
          description: The card network.
          enum:
          - visa
        bid:
          type: string
          description: The assigned Business Identifier of the acquirer.
          pattern: ^[a-zA-Z0-9]+$
          minLength: 1
          maxLength: 120
        quarter:
          $ref: '#/components/schemas/quarter'
        year:
          $ref: '#/components/schemas/year'
        currency:
          $ref: '#/components/schemas/currency'
  responses:
    openapi_components-responses-ForbiddenError-3:
      description: The authenticated client is forbidden to make the request for the resource identified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/openapi_components-schemas-ProblemDetail-2'
          example:
            type: /silverflow/problems/forbidden
            title: Forbidden
            status: 403
            detail: 'Authenticated user ''apk-33GjasQdWl4781OsErvi'' is missing the following permission(s): reports:List'
            instance: /silverflow/b0451a9d-f66d-4ef7-9f5d-d48064a2bb3e
    openapi_components-responses-TooManyRequestsError-3:
      description: The number of requests (per minute) has exceeded the configured maximum
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/openapi_components-schemas-ProblemDetail-2'
          example:
            type: /silverflow/problems/too-many-requests
            title: Too Many Requests
            status: 429
            detail: You have exceeded the rate limit. Please try again after the specified delay.
            instance: /silverflow/b0451a9d-f66d-4ef7-9f5d-d48064a2bb3e
  securitySchemes:
    ApiKey:
      description: "The primary method of authenticating to the Silverflow API is through API keys.\n\nAPI keys can be created by calling the [createApiKey](#operation/createApiKey) endpoint. You can create up to 40 API keys and also update and delete them, allowing for _credential rotation_.\n\nThe _Agent Activation_ process will generate an initial API Key for you. See [Activate Agent](#section/Getting-Started).\n\nA call to the [createApiKey](#operation/createApiKey) endpoint will return the following structure:\n\n```json\n{\n    \"key\": \"apk-1wtRxni5IsPsSpBLWpwr\",\n    \"status\": \"active\",\n    \"agentKey\": \"cgt-1wtRvFLIjDOyyUR5Q2LB\",\n    \"description\": \"Data lake API key\",\n    \"permissions\": [\n        \"charges:List\",\n        \"reports:All\"\n    ],\n    \"created\": \"2021-06-22T11:21:45.115Z\",\n    \"secret\": \"FWtnOOHAjbD6rNxWWEeVOCj7JXSEPGJQ\",\n    \"version\": 1\n}\n```\n\n> **Important:** The `secret` is only returned once in the response to the `createApiKey` call.\n\nOnce created, the `key` and `secret` fields from the API key must be used in the HTTP `Authorization` header using the `Basic` scheme.\nThe Basic scheme requires a **username** and **password** to be specified, separated by a `:` (colon) and Base64 encoded.\n\nUse the following values from the API key to construct a Basic authentication header:\n\n| Basic field | API key field | Example |\n| ----------- | ------------- | ------- |\n| username | `key` | `apk-1wtRxni5IsPsSpBLWpwr` |\n| password | `secret` | `FWtnOOHAjbD6rNxWWEeVOCj7JXSEPGJQ` |\n\nIn pseudo-code a valid HTTP Basic Authentication header would be constructed as follows:\n\n```ts\nconst apiKeyId = \"apk-1wtRxni5IsPsSpBLWpwr\";\nconst apiKeySecret = \"FWtnOOHAjbD6rNxWWEeVOCj7JXSEPGJQ\";\nconst authnValue = \"Basic \" + base64Encode(apiKeyId + \":\" + apiKeySecret);\nrequest.setHeader(\"Authorization\", authnValue);\n```\n\nUsing the values from the example a valid HTTP request would look like the following:\n\n```http\nGET /v1/agents/current HTTP/1.1\nAccept: application/json\nAuthorization: Basic YXBrLTF3dFJ4bmk1SXNQc1NwQkxXcHdyOkZXdG5PT0hBamJENnJOeFdXRWVWT0NqN0pYU0VQR0pR\n```\n\nMore information on the Basic scheme can be found in [RFC-7617 - The 'Basic' HTTP Authentication Scheme](https://datatracker.ietf.org/doc/html/rfc7617)."
      type: http
      scheme: basic
    BearerToken:
      description: 'Bearer tokens are temporary security credentials that can be used to authorize ''third parties'' (bearers) access to the Silverflow API on behalf of the agent.


        These tokens are created by calling the [createAgentBearerToken](#operation/createAgentBearerToken) endpoint.


        Once created the `token` field must be used in the HTTP `Authorization` header using the `Bearer` scheme.

        Here''s an example of an HTTP request with a bearer token:


        ```http

        GET /v1/merchants/mct-1hPdFhmgaBzMS191nIbJ HTTP/1.1

        Accept: application/json

        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...40EFOgxf_3I6mPZ16bXqHd5tUyApgl0mNOAXPm5AhnA


        ```


        More information on the Bearer scheme can be found in [RFC-6750 - The OAuth 2.0 Authorization Framework: Bearer Token Usage](https://datatracker.ietf.org/doc/html/rfc6750).'
      type: http
      scheme: bearer
      bearerFormat: JWT
    MutualTLS:
      type: apiKey
      in: header
      name: '-'
      description: 'The client must set up mTLS connection with a valid X.509 client certificate signed by a customer-provided CA (certificate authority) that is registered to a specific agent. The customer-provided CA certificate must be shared and added to Silverflow''s trust store prior to calling endpoints.


        Certificate validation happens at the transport layer during TLS handshake. Tenant verification is performed by matching the agent key embedded in the client certificate against the agent key embedded in the trusted CA.

        '

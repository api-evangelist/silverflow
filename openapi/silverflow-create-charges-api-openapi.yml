    isoFieldEciVisa:
      type: string
      description: E-commerce Indicator
      example: '5'
    charges-funding_FundingReceiver:
      type: object
      description: Required when `type.intent` is `funding`. Details of the recipient of the funds.
      required:
      - firstName
      - lastName
      - accountNumber
      - address
      properties:
        type:
          allOf:
          - description: The type of the receiver.
          - $ref: '#/components/schemas/SenderReceiverType'
        organizationName:
          allOf:
          - description: The name of the organization.
          - $ref: '#/components/schemas/SenderReceiverOrganizationName'
        firstName:
          allOf:
          - description: Recipient's first name.
          - $ref: '#/components/schemas/schemas-NameOfPeopleAndPlaces'
        middleName:
          allOf:
          - description: Recipient's middle name.
          - $ref: '#/components/schemas/schemas-NameOfPeopleAndPlaces'
        lastName:
          allOf:
          - description: Recipient's last name.
          - $ref: '#/components/schemas/schemas-NameOfPeopleAndPlaces'
        accountNumber:
          allOf:
          - description: The masked account number of the recipient.
          - $ref: '#/components/schemas/MaskedAccountNumber'
        accountNumberType:
          $ref: '#/components/schemas/AccountNumberType'
        address:
          allOf:
          - description: The address of the recipient.
          - $ref: '#/components/schemas/FundingAddress'
    schemas-AcceptorResolver:
      type: object
      description: 'The resolver is used to select the appropriate merchant acceptor for creating the charge.

        It can accept either a `merchantAcceptorKey` or a combination of `merchantKey` and an optional `route`. If the optional property for `route` is not provided

        the default one generated when creating an acceptor will be used.

        '
      oneOf:
      - $ref: '#/components/schemas/schemas-ResolverByAcceptorKey'
      - $ref: '#/components/schemas/schemas-ResolverByMerchant'
    PayoutTransactionType:
      type: string
      enum:
      - tax-refund
      - cryptocurrency
      - central-bank-digital-currency
      - stablecoin
      - blockchain-native-coin
      - non-fungible-token
      description: 'In case of a special transaction type, this allows you to specify which one.


        - `tax-refund`: A transaction involving a tax rebate. Only allowed for `payoutType` of `general-funds-disbursement`. Required for USA cardholders. <span class="tag network-tag visa-tag">VISA</span>

        - `cryptocurrency`: A transaction involving the purchasing of cryptocurrencies. Use this for Visa only if specific type of digital asset cannot be determined. Only allowed for Mastercard when `payoutType` is `account-to-account`. <span class="tag network-tag visa-tag">VISA</span><span class="tag network-tag mastercard-tag">MASTERCARD</span>

        - `central-bank-digital-currency`: A transaction involving purchase of a Central Bank Digital Currency (CBDC). <span class="tag network-tag visa-tag">VISA</span>

        - `stablecoin`: A transaction involving purchase of stablecoins. <span class="tag network-tag visa-tag">VISA</span>

        - `blockchain-native-coin`: A transaction involving purchase of a non fiat backed blockchain coin. <span class="tag network-tag visa-tag">VISA</span>

        - `non-fungible-token`: A transaction involving purchase of a Non Fungible Token (NFT). <span class="tag network-tag visa-tag">VISA</span>

        '
    PinBlockDataIso0Iso1:
      type: string
      title: ISO-0/ISO-1 Block
      description: 'Contains encrypted PIN information, formatted as an `ISO-0`/`ISO-1` block of 16 hexadecimal characters.

        '
      pattern: ^[A-Fa-f0-9]+$
      minLength: 16
      maxLength: 16
      example: 32CF86E514CB24FE
    PinBlockKeyId:
      type: string
      pattern: ^[a-zA-Z0-9()+,\-.:=@;$_!*\/?#|]*$
      minLength: 1
      maxLength: 128
      description: Encryption key in the specified zone to use.
    isoFieldEciDiscover:
      type: string
      description: E-commerce Indicator
    FundingChargeType:
      type: object
      description: Describes the kind of charge the merchant wants to submit.
      required:
      - intent

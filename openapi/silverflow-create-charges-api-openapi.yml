          $ref: '#/components/schemas/expiryMonthOptional'
        expiryYear:
          $ref: '#/components/schemas/expiryYearOptional'
        cvc:
          $ref: '#/components/schemas/schemas-cvc'
        holderName:
          $ref: '#/components/schemas/schemas-holderName'
    PosCardInput:
      type: object

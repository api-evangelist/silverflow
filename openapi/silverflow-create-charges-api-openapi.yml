      minLength: 1
      maxLength: 3
      example: '001'
    schemas-merchantKey:
      description: Uniquely identifies a merchant.
      type: string
      pattern: ^mct-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
      example: mct-1234abcdef123
    StoredTokenDetailsDigitalWallet:
      type: object

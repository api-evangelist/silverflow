          $ref: '#/components/schemas/PayoutReceiverInput'
        transactionType:
          $ref: '#/components/schemas/PayoutTransactionType'
        purposeOfPayment:
          $ref: '#/components/schemas/purposeOfPayment'
        dynamicDescriptor:
          $ref: '#/components/schemas/schemas-DynamicDescriptor'
        clearingMode:
          allOf:
          - description: "The clearing method for the charge. \n- `auto`: The charge is cleared automatically as soon as possible. To delay clearing, provide a `clearAfter` timestamp.\n- `manual`: The charge must be manually cleared later.\n\n**Only supported for <span class=\"tag network-tag mastercard-tag\">MASTERCARD</span>.**\n"
          - $ref: '#/components/schemas/clearingMode'
        clearAfter:
          allOf:
          - description: 'If provided, clearing will not occur before this point in time. This is only supported when using `clearingMode` `auto`.


              The value may be at most 6 months in the future from when the charge was created.


              This field is only supported for <span class="tag network-tag mastercard-tag">MASTERCARD</span>

              '
          - $ref: '#/components/schemas/clearAfter'

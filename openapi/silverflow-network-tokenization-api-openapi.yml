    CardHolderInput:
      type: object
      description: 'Information about the card holder.

        '
      properties:
        name:
          $ref: '#/components/schemas/openapi_components-schemas-holderName-2'
        email:
          description: The email of the card holder.
          allOf:
          - $ref: '#/components/schemas/email'
        phoneNumber:
          description: The phone number of the card holder.
          allOf:
          - $ref: '#/components/schemas/schemas-phoneNumber'
        billingAddress:
          description: The billing address of the card holder.
          allOf:
          - $ref: '#/components/schemas/components-schemas-AddressInput'
    email:
      type: string
      description: A valid email address
      pattern: \w+([-+.']\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*
    TokensPage:
      allOf:
      - $ref: '#/components/schemas/openapi_components-schemas-PageWithMoreItems'
      - type: object
        required:
        - charges
        properties:
          tokens:
            type: array
            items:
              $ref: '#/components/schemas/Token'
    openapi_components-schemas-CountryCodeAlpha3:
      type: object
      required:
      - alpha3
      additionalProperties: false
      properties:
        alpha3:
          $ref: '#/components/schemas/openapi_components-schemas-countryCodeAlpha3'
    schemas-errorTitle:
      description: 'A short, summary of the problem type. Written in english and readable

        for engineers (usually not suited for non technical stakeholders and

        not localized).

        '
      type: string
    tokenStatus:
      description: The status of the network token.
      type: string
      enum:
      - requested
      - active
      - suspended
      - failed
      - archivePending
      - archived
    schemas-track2Data:
      type: string
      description: 'The information encoded on track 2 of the card magnetic stripe as defined in the ISO 7813 specification, including data element separators but excluding beginning and ending sentinels.

        '
      pattern: ^[A-Fa-f0-9]+$
      minLength: 1
      maxLength: 40
      example: 6799995700000004054D25122010875408456
    openapi_components-schemas-stateOrProvince-2:
      type: string
      minLength: 1
      description: 'The state (US) or province (non-US) of the address.

        '
    lastModified:
      type: string
      description: The date and time this object was last modified
      format: date-time
    openapi_components-schemas-ProblemDetail-3:
      description: 'The ''problem detail'' object relays detailed information about the error that occurred. It is defined

        by [RFC 7807 - Problem Details for HTTP APIs](https://tools.ietf.org/html/rfc7807).


        Note that additional properties may be used to relay error specific information. For instance,

        A Invalid Input error may hold information about the individual validation errors found in the request.

        '
      type: object
      additionalProperties: true
      properties:
        type:
          description: A relative URI that identifies the problem type.
          type: string
          example: /silverflow/problems/internal-server-error
        title:
          $ref: '#/components/schemas/schemas-errorTitle'
        status:
          $ref: '#/components/schemas/openapi_components-schemas-errorStatus'
        detail:
          $ref: '#/components/schemas/schemas-errorDetail'
        instance:
          $ref: '#/components/schemas/schemas-errorInstance'
    TokenCreate:
      type: object
      description: Fields used to create a token.
      required:
      - enrollmentKey
      - type
      - cardData
      properties:
        enrollmentKey:
          $ref: '#/components/schemas/schemas-enrollmentKey'
        type:
          $ref: '#/components/schemas/tokenType'
        cardData:
          $ref: '#/components/schemas/openapi_components-schemas-CardInput'
    openapi_components-schemas-city-2:
      type: string
      minLength: 1
      description: 'The city of the address.

        '
    common_offsetToken:
      type: string
      pattern: ^[a-zA-Z0-9%]+$
      description: 'An offset token that can be used to retrieve the next page of items.

        '
    TokenData:
      type: object
      required:
      - number
      - expiryMonth
      - expiryYear
      - paymentAccountReference
      description: Network token data
      properties:
        number:
          $ref: '#/components/schemas/tokenNumber'
        expiryMonth:
          $ref: '#/components/schemas/tokens_expiryMonth'
        expiryYear:
          $ref: '#/components/schemas/tokens_expiryYear'
        paymentAccountReference:
          $ref: '#/components/schemas/paymentAccountReference'
    tokenType:
      type: string
      description: The type of network token.
      enum:
      - merchant
    schemas-errorInstance:
      description: 'An absolute URI that identifies the specific occurrence of the problem.

        It may or may not yield further information if dereferenced.

        '
      type: string
    expiryMonth:
      type: integer
      description: 'The month the card expires. January is 1

        '
      minimum: 1
      maximum: 12
    lastTokenRefresh:
      type: string
      description: The date and time this network token was last refreshed
      format: date-time
    TokenCryptogram:
      type: object
      description: All details related to a network token cryptogram.
      required:
      - authenticationData
      - created
      properties:
        panSequenceNumber:
          $ref: '#/components/schemas/panSequenceNumber'
        track2Equivalent:
          $ref: '#/components/schemas/schemas-track2Data'
        authenticationData:
          $ref: '#/components/schemas/authenticationData'
        created:
          $ref: '#/components/schemas/created'
    openapi_components-schemas-cvc:
      type: string
      description: 'The CVC of the card

        '
      pattern: ^\d+$
      minLength: 3
      maxLength: 3
      example: '123'
    schemas-enrollmentKey:
      type: string
      description: SCOF or VTS enrollment key
      pattern: ^enr-[a-zA-Z0-9]+$
      minLength: 10
      maxLength: 120
      example: enr-25os7SQOxkKeQwUKYXIG
    openapi_components-schemas-errorStatus:
      description: 'The HTTP status code generated by the origin server for this occurrence

        of the problem.

        '
      type: integer
      format: int32
      minimum: 100
      maximum: 599
    limit:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      default: 10
    schemas-errorDetail:
      description: 'A human readable explanation specific to this occurrence of the

        problem.

        '
      type: string
      example: Connection to database timed out
    openapi_components-schemas-line2-3:
      type: string
      minLength: 1
      description: Address line 2
    tokenProvider:
      description: The network token provider
      type: string
      enum:
      - scof
      - vts
    schemas-agentKey:
      description: Uniquely identifies an Agent
      type: string
      pattern: ^cgt-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
      example: cgt-1UF2NafdfrdPMf2XrS2
    Token:
      type: object
      required:
      - key
      - status
      - type
      - network
      - provider
      - agentKey
      - merchantKey

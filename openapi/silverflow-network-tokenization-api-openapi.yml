openapi: 3.2.0
info:
  description: '**This OpenAPI specification cannot be used for code generation.** Please reach out to your TAM regarding code generation using the API Spec.'
  version: 1.417.0
  title: Silverflow Network Tokenization API
  contact:
    name: API Support
    email: support@silverflow.com
  license:
    name: Commercial
servers:
- url: https://eu-west-1.api.silverflow.com/v1
  description: Production URL for Europe - Equivalent to https://api.silverflow.co/v1
- url: https://us-east-2.api.silverflow.com/v1
  description: Production URL for North America
- url: https://eu-west-1.api-sbx.silverflow.com/v1
  description: Sandbox URL - Equivalent to https://api-sbx.silverflow.co/v1
security:
- ApiKey: []
- BearerToken: []
tags:
- name: Network Tokenization
  description: Network Tokenization
paths:
  /networkTokens:
    post:
      operationId: createNetworkToken
      summary: Create Network Token
      description: 'Used to let Silverflow create a network token on behalf of the caller.


        Requires the `networkTokens:Create` permission.'
      tags:
      - Network Tokenization
      requestBody:
        description: 'Create a network token.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
            example:
              enrollmentKey: enr-25os7SQOxkKeQwUKYXIG
              type: merchant
              cardData:
                number: '1234123412341234'
                expiryMonth: 1
                expiryYear: 2020
                cvc: '123'
                holder:
                  name: Joe Cardholder
                  email: joe@nowhere.com
                  phoneNumber: +31(0)850609160
                  billingAddress:
                    countryCode:
                      alpha2: NL
                    city: Amsterdam
                    line1: Rokin 1
                    postalCode: 1000AB
      responses:
        '200':
          description: The network token entity that matches the enrollment key and the given PAN.
          headers:
            Location:
              description: The URL of the returned token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                key: ntk-1e1dAHhgstYTUhlphPzZ
                status: active
                type: merchant
                network: mastercard
                provider: scof
                agentKey: cgt-1UF2NafdfrdPMf2XrS2
                merchantKey: mct-3Jrv9Sq4SBQhrsHJZgYK
                enrollmentKey: enr-25os7SQOxkKeQwUKYXIG
                lastTokenRefresh: '2023-01-19T14:31:46Z'
                created: '2023-01-19T14:15:22Z'
                lastModified: '2023-01-19T14:31:46Z'
                version: 2
        '201':
          description: The newly created network token entity.
          headers:
            Location:
              description: The URL of the newly created network token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                key: ntk-1e1dAHhgstYTUhlphPzZ
                status: requested
                type: merchant
                network: mastercard
                provider: scof
                agentKey: cgt-1UF2NafdfrdPMf2XrS2
                merchantKey: mct-3Jrv9Sq4SBQhrsHJZgYK
                enrollmentKey: enr-25os7SQOxkKeQwUKYXIG
                created: '2023-01-19T14:15:22Z'
                version: 1
        '400':
          $ref: '#/components/responses/openapi_components-responses-BadRequestError'
        '401':
          $ref: '#/components/responses/openapi_components-responses-UnauthorizedError-4'
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-4'
        '409':
          $ref: '#/components/responses/components-responses-ConflictError'
        '422':
          $ref: '#/components/responses/responses-UnprocessableContentError'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-4'
        '500':
          $ref: '#/components/responses/openapi_components-responses-InternalServerError'
        '503':
          $ref: '#/components/responses/components-responses-ServiceUnavailableError'
    get:
      operationId: listNetworkTokens
      summary: List Network Tokens
      description: 'This operation returns a (paged) list of all the stored network tokens for the authenticated Agent.


        Requires `networkTokens:List` permission.'
      tags:
      - Network Tokenization
      parameters:
      - $ref: '#/components/parameters/parameters-enrollmentKey'
      - $ref: '#/components/parameters/components-parameters-merchantKey'
      - $ref: '#/components/parameters/tokenStatus'
      - $ref: '#/components/parameters/openapi_components-parameters-offsetToken'
      - $ref: '#/components/parameters/components-parameters-limit'
      - $ref: '#/components/parameters/openapi_components-parameters-sortOrder-2'
      responses:
        '200':
          description: A (paged) list of network tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensPage'
        '400':
          $ref: '#/components/responses/openapi_components-responses-BadRequestError'
        '401':
          $ref: '#/components/responses/openapi_components-responses-UnauthorizedError-4'
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-4'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-4'
        '500':
          $ref: '#/components/responses/openapi_components-responses-InternalServerError'
        '503':
          $ref: '#/components/responses/components-responses-ServiceUnavailableError'
  /networkTokens/{networkTokenKey}:
    get:
      operationId: getNetworkToken
      summary: Get Network Token
      description: 'Returns a network token by its key.


        Requires the `networkTokens:Get` permission.'
      tags:
      - Network Tokenization
      parameters:
      - $ref: '#/components/parameters/networkTokenKey'
      responses:
        '200':
          description: A network token entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/openapi_components-responses-BadRequestError'
        '401':
          $ref: '#/components/responses/openapi_components-responses-UnauthorizedError-4'
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-4'
        '404':
          $ref: '#/components/responses/openapi_components-responses-NotFoundError-2'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-4'
        '500':
          $ref: '#/components/responses/openapi_components-responses-InternalServerError'
        '503':
          $ref: '#/components/responses/components-responses-ServiceUnavailableError'
    delete:
      operationId: archiveNetworkToken
      summary: Archive Network Token
      description: 'Used to archive a network token. This operation is not reversable, and will make the network token unusable.


        Requires the `networkTokens:Archive` permission.'
      tags:
      - Network Tokenization
      parameters:
      - $ref: '#/components/parameters/networkTokenKey'
      responses:
        '202':
          description: Network token archive request accepted.
        '400':
          $ref: '#/components/responses/openapi_components-responses-BadRequestError'
        '401':
          $ref: '#/components/responses/openapi_components-responses-UnauthorizedError-4'
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-4'
        '404':
          $ref: '#/components/responses/openapi_components-responses-NotFoundError-2'
        '409':
          $ref: '#/components/responses/components-responses-ConflictError'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-4'
        '500':
          $ref: '#/components/responses/openapi_components-responses-InternalServerError'
        '503':
          $ref: '#/components/responses/components-responses-ServiceUnavailableError'
  /networkTokens/{networkTokenKey}/networkTokenData:
    get:
      operationId: getNetworkTokenData
      summary: Get Network Token Data
      description: 'The contents of the network token that is associated with a network token key.


        It does not include the network token cryptogram, this has to be created with the Create Network Token Cryptogram endpoint.


        Requires the `networkTokens:GetNetworkTokenData` permission.'
      tags:
      - Network Tokenization
      parameters:
      - $ref: '#/components/parameters/networkTokenKey'
      responses:
        '200':
          description: Network token data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenData'
              examples:
                GetTokenDataMastercard:
                  $ref: '#/components/examples/get-token-data-response-mastercard'
                GetTokenDataVisa:
                  $ref: '#/components/examples/get-token-data-response-visa'
        '400':
          $ref: '#/components/responses/openapi_components-responses-BadRequestError'
        '401':
          $ref: '#/components/responses/openapi_components-responses-UnauthorizedError-4'
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-4'
        '404':
          $ref: '#/components/responses/openapi_components-responses-NotFoundError-2'
        '409':
          $ref: '#/components/responses/components-responses-ConflictError'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-4'
        '500':
          $ref: '#/components/responses/openapi_components-responses-InternalServerError'
        '503':
          $ref: '#/components/responses/components-responses-ServiceUnavailableError'
  /networkTokens/{networkTokenKey}/cryptogram:
    post:
      operationId: createNetworkTokenCryptogram
      summary: Create Network Token Cryptogram
      description: 'Used to obtain a DSRP or TAVV cryptogram for the referenced network token. These should be provided for each initial CIT and MIT charges and for all subsequent CIT charges.


        Requires the `networkTokens:CreateNetworkTokenCryptogram` permission.'
      tags:
      - Network Tokenization
      parameters:
      - $ref: '#/components/parameters/networkTokenKey'
      responses:
        '200':
          description: The created network token cryptogram.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCryptogram'
        '400':
          $ref: '#/components/responses/openapi_components-responses-BadRequestError'
        '401':
          $ref: '#/components/responses/openapi_components-responses-UnauthorizedError-4'
        '403':
          $ref: '#/components/responses/openapi_components-responses-ForbiddenError-4'
        '404':
          $ref: '#/components/responses/openapi_components-responses-NotFoundError-2'
        '409':
          $ref: '#/components/responses/components-responses-ConflictError'
        '422':
          $ref: '#/components/responses/responses-UnprocessableContentError'
        '429':
          $ref: '#/components/responses/openapi_components-responses-TooManyRequestsError-4'
        '500':
          $ref: '#/components/responses/openapi_components-responses-InternalServerError'
        '503':
          $ref: '#/components/responses/components-responses-ServiceUnavailableError'

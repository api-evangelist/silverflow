    CreateEnrollment:
      oneOf:
      - $ref: '#/components/schemas/AmexSponsoredMerchantEnrollmentCreate'
      - $ref: '#/components/schemas/DiscoverMerchantEnrollmentCreate'
      - $ref: '#/components/schemas/ScofEnrollmentCreate'
      - $ref: '#/components/schemas/VauEnrollmentCreate'
      - $ref: '#/components/schemas/VtsEnrollmentCreate'
      discriminator:
        propertyName: type
        mapping:
          vts: '#/components/schemas/VtsEnrollmentCreate'
          vau: '#/components/schemas/VauEnrollmentCreate'
          scof: '#/components/schemas/ScofEnrollmentCreate'
          discover-mpr: '#/components/schemas/DiscoverMerchantEnrollmentCreate'
          amex_sm: '#/components/schemas/AmexSponsoredMerchantEnrollmentCreate'
    AmexSponsoredMerchantEnrollmentArchive:
      type: object
      description: Archive Sponsored Merchant request for American Express.
      required:
      - type
      - reason
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - amex_sm
          description: 'Type of the enrollment.

            * `amex_sm` - American Express, Sponsored Merchant (**Please reach out to your technical account manager to enable your production access**)

            * `issm` - Mastercom Identity Solutions Service Manager [DEPRECATED]

            '
        reason:
          $ref: '#/components/schemas/amexCancellationReason'
    VtsEnrollment:
      allOf:
      - $ref: '#/components/schemas/Enrollment'
      - type: object
        description: VTS enrollment <a class="experimental-tag-link" href="https://docs.silverflow.com/guides/api-lifecycle#tag/EXPERIMENTAL-Tag"><span class="tag experimental-tag">EXPERIMENTAL</span></a>
        required:
        - enrollmentDetail
        properties:
          enrollmentDetail:
            $ref: '#/components/schemas/VtsEnrollmentDetail'
    ScofEnrollmentCreate:
      allOf:
      - $ref: '#/components/schemas/BaseEnrollmentCreate'
      - type: object
        description: Create SCOF enrollment
        required:
        - merchantKey
        - type
        - binKey
        - mid
        - programType
        - programName
        properties:
          type:
            type: string
            enum:
            - scof
            description: 'Type of the enrollment.

              * `amex_sm` - American Express, Sponsored Merchant (**Please reach out to your technical account manager to enable your production access**)

              * `discover-mpr` - Discover, Merchant Profile Registration

              * `scof` - Mastercom Secure Card on File

              * `vau` - Visa Account Updater

              * `vts` - Visa Token Service (see [guide](https://docs.silverflow.com/guides/merchant-enrollment#tag/Visa-VTS-Enrollment))

              '
          binKey:
            $ref: '#/components/schemas/binKey'
          mid:
            $ref: '#/components/schemas/mid'
          programType:
            $ref: '#/components/schemas/ScofProgramType'
          programName:
            $ref: '#/components/schemas/ScofProgramName'
          mccs:
            type: array
            minItems: 1
            maxItems: 20
            items:
              $ref: '#/components/schemas/mcc'
    addressCreateForAmexSMApi:
      type: object
      required:
      - line1
      - city
      - postalCode
      - countryCode
      properties:
        line1:
          $ref: '#/components/schemas/addressLine'
        line2:
          $ref: '#/components/schemas/addressLine'
        city:
          $ref: '#/components/schemas/addressCity'
        postalCode:
          $ref: '#/components/schemas/postalCode'
        countryCode:
          $ref: '#/components/schemas/CountryCodeCreate'
        stateOrProvince:
          $ref: '#/components/schemas/stateOrProvince'
    offsetToken:
      type: string
      pattern: ^[a-zA-Z0-9%]+$
      minLength: 1
      maxLength: 2048
    deleteReason:
      type: string
      enum:
      - Data Entry Error
      - Merchant No Longer Participating
      - Acquirer BIN Change
      - Acquirer Primary ICA Change
      - Other
      description: Issm Unenrollment reason. If empty `Other` will be used.
    VauEnrollment:

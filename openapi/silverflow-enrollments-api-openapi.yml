      - open-existing-merchant-entitled-for-card-acceptance
      - conversion-renumbered
    signerLastName:
      type: string
      description: The Seller's Authorized Signer complete last name. For individuals whose name includes two or more family names (i.e. father's surname and mother's surname), all family names must be included in this field without exception.
      pattern: ^[a-zA-Z0-9 -]+$
      minLength: 1
      maxLength: 20
    businessRegistrationNumber:
      description: The Seller's Tax Identification Number or their functional equivalents.
      type: string
      pattern: ^[a-zA-Z0-9]+$
      minLength: 1
      maxLength: 15
    BaseEnrollmentCreate:
      type: object
      required:
      - merchantKey
      - type
      properties:
        merchantKey:
          $ref: '#/components/schemas/merchantKey'
        type:
          $ref: '#/components/schemas/enrollmentCreateType'
        binKey:
          $ref: '#/components/schemas/binKey'
    acquirerSegmentId:
      description: VAU acquirer segment identifier
      type: number
    postalCode:
      type: string
      pattern: ^[A-Z0-9]+([ -][A-Z0-9]+)?$
      minLength: 1
      maxLength: 10
      description: 'The postal code of the address. Clients not enrolled in the "extended character set beta" are still subject to the `^[A-Z0-9]+(\ [A-Z0-9]*)?$` pattern for field input.

        '
      example: 1114 AA
    ScofEnrollment:
      allOf:
      - $ref: '#/components/schemas/Enrollment'
      - type: object
        description: SCOF enrollment <a class="experimental-tag-link" href="https://docs.silverflow.com/guides/api-lifecycle#tag/EXPERIMENTAL-Tag"><span class="tag experimental-tag">EXPERIMENTAL</span></a>
        required:
        - enrollmentDetail
        properties:
          enrollmentDetail:
            $ref: '#/components/schemas/ScofEnrollmentDetail'
    merchantLegalName:
      allOf:
      - $ref: '#/components/schemas/ExtendedNameOfPeopleAndPlaces'
      - description: The legal name of the Merchant. Clients not enrolled in the "extended character set beta" are still subject to the `^[\w ,\.\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF-\/]+$` pattern for field input.
    binKey:
      description: A key assigned by Silverflow to uniquely identify a Bin.
      type: string
      pattern: ^bin-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
    signer:
      allOf:
      - $ref: '#/components/schemas/signerBase'
      - type: object
        description: This field is meant for signer of the Seller.
        required:
        - address
        properties:
          address:
            $ref: '#/components/schemas/addressForAmexSMApi'
    addressForAmexSMApi:
      type: object
      required:
      - line1
      - city
      - postalCode

    enrollmentKey:
      description: Uniquely identifies an Enrollment.
      type: string
      pattern: ^enr-[a-zA-Z0-9]
      example: enr-1UF2NafdfrdPMf2XrS2
    discoverMerchantType:
      description: This field identifies the type of Merchant Profile established with Discover.
      type: string
      enum:
      - self-managed-outlet
      - headquarter-account
      - outlet-reporting-to-headquarter
    mid:
      type: string
      description: 'As per card network requirements, the Merchant ID assigned by the acquirer must uniquely identify a legal merchant per acquirer BIN.


        **Note:** For AMEX merchant acceptors, either provide Seller ID of a seller onboarded by a Payfac, or SE number of an AMEX Direct Merchant.


        | Network | Length | Characters | Pattern |

        | ------- | ------ | ---------- | --------|

        | AMEX  | 1-20 | alphanumeric |  /^[a-zA-Z0-9-_\.]+$/ |

        | Bancontact  | 1-15 | alphanumeric | /^[a-zA-Z0-9-_\.]+$/ |

        | Diners | 1-15 | alphanumeric |  /^[a-zA-Z0-9# -]+$/ |

        | Discover | 1-15 | alphanumeric | /^[a-zA-Z0-9-_\.]+$/  |

        | Mastercard | 1-15 | alphanumeric | /^[a-zA-Z0-9-_\.]+$/ |

        | Visa  | 1-15 | alphanumeric | /^[a-zA-Z0-9-_\.]+$/ |

        '
      minLength: 1
      maxLength: 20
      example: UO2344SDDAUOGS
    signerIdentificationNumber:
      type: string
      description: The identification number of the Seller's Authorized Signer.
      pattern: ^[a-zA-Z0-9]+$
      minLength: 1
      maxLength: 30
    signerCreate:
      allOf:
      - $ref: '#/components/schemas/signerBase'
      - type: object
        description: This field is mean for signer of Seller during creation.
        required:
        - address
        properties:
          address:
            $ref: '#/components/schemas/addressCreateForAmexSMApi'
    businessIdentificationValue:
      type: string
      example: NL123456789B01
      pattern: ^[a-zA-Z0-9]{1,15}$
    phoneNumber:
      type: string
      description: An international phone number
      pattern: ^(00|\+)[1-9]\d+$
      minLength: 5
      maxLength: 33
      example: '+31850609160'
    sellerLegalName:
      allOf:
      - $ref: '#/components/schemas/ExtendedNameOfPeopleAndPlaces'
      - description: The Seller's legal name. If the name is more than 60 characters, use proper and meaningful abbreviation, when possible. Do not truncate.
      - minLength: 1
      - maxLength: 60
    authorizationCurrency:
      type: string
      allOf:
      - description: Used by American Express to verify an authorization for the provided SE Number. <br> **Note:** The following currencies are not permitted; **Belarusian Ruble(BYN), Cuban Peso(CUP), Iranian Rial(IRR), North Korean Won(KPW), Russian Federation Ruble(RUB), and Syrian Pound(SYP)**.
      - $ref: '#/components/schemas/currencyCode'
    discoverMid:
      type: string
      description: 'As per card network requirements, the Merchant ID assigned by the acquirer must uniquely identify a legal merchant per acquirer BIN.

        '
      pattern: ^[a-zA-Z0-9-_\.]+$
      minLength: 1
      maxLength: 15
      example: UO2344SDDAUOGS
    enrollmentType:
      description: 'Type of the enrollment.

        * `amex_sm` - American Express, Sponsored Merchant (**Please reach out to your technical account manager to enable your production access**)

        * `discover-mpr` - Discover, Merchant Profile Registration

        * `issm` - Mastercom Identity Solutions Service Manager [DEPRECATED]

        * `scof` - Mastercom Secure Card on File

        * `vau` - Visa Account Updater

        * `vts` - Visa Token Service (see [guide](https://docs.silverflow.com/guides/merchant-enrollment#tag/Visa-VTS-Enrollment))

        '
      type: string
      enum:
      - amex_sm
      - discover-mpr
      - issm
      - scof
      - vau
      - vts
    signerBase:
      description: Base properties for the Seller's Authorized Signer.
      type: object
      required:
      - firstName
      - lastName
      - identificationNumber
      - dateOfBirth
      properties:
        firstName:
          $ref: '#/components/schemas/signerFirstName'
        lastName:

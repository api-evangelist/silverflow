      - sequence
      properties:
        intent:
          type: string
          enum:
          - purchase
        cardEntry:
          type: string
          enum:
          - card-on-file
        order:
          type: string
          enum:
          - one-click
          - recurring
        sequence:
          type: string
          enum:
          - subsequent
    FundingType:
      type: string
      description: "Describes the type of funding charge.\n  - `account-to-account`: Transfer funds to a specific type of account. This can be specified in the `receiver`.\n  - `general-funds-disbursement`: Funding transaction used to enable a payout disbursement for various use cases.\n  - `liquid-assets`: Funding type used for direct acquisition of liquid and cryptocurrency assets or to prefund a wallet primarily used for such assets (e.g., stocks, shares, foreign currency exchange, or cryptocurrency). Currently only supported for **Visa.**\n  - `wallet-transfer`: Transfer funds to a wallet. Currently only supported for **Visa.**\n  - `person-to-person`: Transaction that uses funds from the sender’s account to fund a subsequent and linked transaction to the receiver's account. Currently only supported for **Mastercard.**\n  - `me-to-me`: Transaction that debits a card account of a consumer or organization for the purpose of transferring funds to the same consumer or organization. Currently only supported for **Mastercard.** <a class=\"experimental-tag-link\" href=\"https://docs.silverflow.com/guides/api-lifecycle#tag/EXPERIMENTAL-Tag\"><span class=\"tag experimental-tag\">EXPERIMENTAL</span></a>\n  - `me-to-me-debit-prepaid`: Transaction that debits a card account of a consumer or organization for the purpose of transferring funds to a Debit or Prepaid account of the same consumer or organization. Currently only supported for **Mastercard.** <a class=\"experimental-tag-link\" href=\"https://docs.silverflow.com/guides/api-lifecycle#tag/EXPERIMENTAL-Tag\"><span class=\"tag experimental-tag\">EXPERIMENTAL</span></a>\n"
      enum:
      - account-to-account
      - general-funds-disbursement
      - liquid-assets
      - wallet-transfer
      - person-to-person
      - me-to-me
      - me-to-me-debit-prepaid
    complianceBEP:
      description: 'Indicates SCA compliance of the charges

        '
      type: string
      enum:
      - mandated
    schemas-NameOfPeopleAndPlaces:
      type: string
      pattern: ^[\w -,\.\-\u00C0-\u00D6\u00D8-\u00F6\u00F8-\u00FF]+$
      minLength: 1
      maxLength: 120
      example: Name
    WipType:
      type: object
      additionalProperties: false
      required:
      - intent
      - cardEntry
      - order
      properties:
        intent:
          type: string
          enum:
          - purchase
        cardEntry:
          type: string
          enum:
          - card-on-file
        order:
          type: string
          enum:
          - one-click
          - recurring
    ChargeAuthenticationWip:
      type: object
      required:
      - sca
      - cvc
      - avs
      description: 'Object container for authentication. If present, contains Strong Customer Authentication (SCA) information, but also indicates whether CVC and AVS was used.

        '
      properties:
        sca:
          $ref: '#/components/schemas/ScaWip'
        cvc:
          description: The result of cvc verification
          enum:
          - none
        avs:
          description: The result of the AVS verification
          enum:
          - none
    schemas-processorTokenKey:
      type: string
      description: The key to a card tokenized in the [Processor Tokenization](#tag/Processor-Tokenization).
      pattern: ^ptk-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
    schemas-DynamicDescriptor:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 'Field supports the merchant customizing the DBA name and city on a per-transaction basis,

        to allow the cardholder to recognize the business name and city on their card or bank statement.

        '
      properties:
        merchantName:
          type: string
          pattern: ^[a-zA-Z0-9-\.!\*=_ ]+$
          description: Recognizable business name that will appear on the customer's card or bank statement.
          example: Acme Inc.
          minLength: 1
          maxLength: 22
        merchantCity:
          type: string
          description: City from which the transaction originated
          example: Amsterdam
          pattern: ^[a-zA-Z0-9-\.!\*=_ ]+$
          minLength: 1
          maxLength: 13
    schemas-ResolverByMerchant:
      type: object
      additionalProperties: false
      required:

        - conversionRate
        properties:
          conversionRate:
            type: object
            required:
            - cardholderBillingConversionRate
            - decimalIndicator
            properties:
              cardholderBillingConversionRate:
                type: number
              decimalIndicator:
                type: number
    MaskedAccountNumber:
      type: string
      description: The masked account number.
      pattern: ^[a-zA-Z0-9 !#$%&'()*+,./:;<=>?@^_`{|}~"\-\[\]\\]+$
      minLength: 1
      maxLength: 50
      example: '************0007'
    UnauthorizedErrorDetails:
      type: object

        '
      discriminator:
        propertyName: network
        mapping:
          bancontact: '#/components/schemas/authorizationIsoFieldsBancontactWithDiscriminator'
          diners: '#/components/schemas/authorizationIsoFieldsDinersWithDiscriminator'
          discover: '#/components/schemas/authorizationIsoFieldsDiscoverWithDiscriminator'

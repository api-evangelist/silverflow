    BaseBin:
      type: object
      required:
      - key
      - status
      - description
      - acquirerCountryCode
      - shared
      - created
      - version
      - acquirerIdCode
      description: 'A Bin is a Bank Identification Number

        '
      properties:
        key:
          $ref: '#/components/schemas/binKey'
        status:
          $ref: '#/components/schemas/status'
        description:
          description: Description of the Bin. Combination of acquirer, region and card network.
          $ref: '#/components/schemas/ExtendedFreeTextField'
          example: Example Acquirer - Mastercard
        acquirerAgentKey:
          $ref: '#/components/schemas/acquirerAgentKey'
        acquirerIdCode:
          type: string
        acquirerCountryCode:
          $ref: '#/components/schemas/CountryCode'
        shared:
          type: boolean
          description: Indicates if this Bin is shared across agents. If so the MIDs are restricted in length to `11`.
        created:
          $ref: '#/components/schemas/created'
        lastModified:
          $ref: '#/components/schemas/lastModified'
        version:
          $ref: '#/components/schemas/version'
      example:
        key: bin-1iXRhbDjrT2Yxvo0mSZN
        status: active
        description: Example Acquirer - Mastercard
        acquirerIdCode: 222222
        acquirerBin: 555555
        acquirerCountryCode:
          alpha3: DEU
          alpha2: DE
          numeric: '276'
        acquirerAgentKey: cgt-1nUP5yspouqwUHYSZo9V
        network: mastercard
        messageSystem: DMS
        shared: false
        created: '2020-08-24T14:15:22.014Z'
        lastModified: '2020-08-24T21:39:01.957Z'
        version: 2
    merchantKey:
      description: Uniquely identifies a Merchant
      type: string
      pattern: ^mct-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
      example: mct-123dinkqFqfq3q2f2adfa
    nullableChargesBlocked:
      type:
      - boolean
      - 'null'
      description: A value of `true` prohibits charges from being created using this Acceptor. If the property is absent upon Acceptor creation a value of `false` is assumed.
    Page:
      type: object
      properties:
        offsetToken:
          $ref: '#/components/schemas/offsetToken'
        moreItems:
          $ref: '#/components/schemas/moreItems'
    acceptorRoute:
      type: string
      pattern: ^(^$|^[a-zA-Z0-9-_:;.,]+$)
      minLength: 0
      maxLength: 255
      description: An optional route key to force route charges
    authorizationCurrencyForAmexDirectMerchant:
      allOf:
      - description: Only required if the acceptor is for an AMEX Direct Merchant Bin. If so, this field contains the authorization currency that corresponds to the SE Number.
      - $ref: '#/components/schemas/currencyCode'

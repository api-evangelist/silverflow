            $ref: '#/components/schemas/ArbitrationDMSSpecific'
      - $ref: '#/components/schemas/BaseReconciliationDetail'
    rrn:
      description: The Retrieval Reference Number; Unique identifier used to identify transactions.
      type: string
      readOnly: true
    SilverflowRegionality:
      readOnly: true
      type: string
      enum:
      - domestic
      - intraregional_eea
      - intraregional_europe
      - intraregional_asia_pacific
      - intraregional_middle_east_and_africa
      - intraregional_latin_america
      - interregional
    MastercardPublicDesignator:
      type: object
      description: 'Mastercard Public Designator

        '
      additionalProperties: false
      required:
      - network
      properties:
        network:
          type: string
          enum:
          - mastercard
        ird:
          description: Interchange Rate Designator as defined by Mastercard. This is a 2 character code.
          type: string
        cardProgramIdentifier:
          description: Card Program Identifier as defined by Mastercard. This is a 3 character code.
          type: string
        type:
          description: Type of the Business Service Arrangement (BSA) as defined by Mastercard.
          type: string
        idCode:
          description: ID Code of the Business Service Arrangement (BSA) as defined by Mastercard.
          type: string
        feeProgramName:
          description: Human-readable description of the Fee Program.
          type: string
    schemas-CardCountry:
      type: object
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/openapi_components-schemas-CountryCode'
    TransactionRegionalitySummary:
      type: object
      description: A summary of the regionality of the transaction per Silverflow's definition <a class="experimental-tag-link" href="https://docs.silverflow.com/guides/api-lifecycle#tag/EXPERIMENTAL-Tag"><span class="tag experimental-tag">EXPERIMENTAL</span></a>
      required:
      - transactionRegionality
      - cardRegion
      - merchantRegion
      properties:
        transactionRegionality:
          allOf:
          - $ref: '#/components/schemas/SilverflowRegionality'
          - description: The regionality of the transaction
        cardRegion:
          allOf:
          - $ref: '#/components/schemas/SilverflowRegion'
          - description: The region of card's country
        merchantRegion:
          allOf:
          - $ref: '#/components/schemas/SilverflowRegion'
          - description: The region of merchant's country
    FirstPresentmentDMSSpecific:
      type: object
      required:
      - processingDate
      - bin
      - arn
      - clearableTime
      - merchantAcceptor
      - chargeKey
      - authorizationAmount
      - clearingAmount
      - grossSettlementAmount
      - interchangeFeeAmount
      - acquirerIdCode
      - transactionType
      - filename
      properties:
        arn:
          description: The Acquirer Reference Number; Unique identifier assigned by the Silverflow at clearing used to identify the transaction with the card networks.
          type: string
          readOnly: true
        processingDate:
          type: string
          format: date
          description: The processing date
        bin:
          $ref: '#/components/schemas/bin'
        clearableTime:
          type: string
          format: date-time
          description: The DateTime after which a transaction should be cleared.
        merchantAcceptor:
          $ref: '#/components/schemas/merchantAcceptor'
        chargeKey:
          $ref: '#/components/schemas/components-schemas-chargeKey'
        authorizationAmount:
          $ref: '#/components/schemas/settlementAmountInteger'
        clearingAmount:
          $ref: '#/components/schemas/settlementAmountInteger'
        grossSettlementAmount:
          $ref: '#/components/schemas/settlementAmountFloatWithRate'
        interchangeFeeAmount:
          $ref: '#/components/schemas/settlementAmountFloatWithRate'
        transactionReference:
          $ref: '#/components/schemas/components-schemas-transactionReference'
        actionKey:
          $ref: '#/components/schemas/components-schemas-actionKey'
        actionReference:
          $ref: '#/components/schemas/components-schemas-actionReference'
        filename:
          type: string
        acquirerIdCode:
          $ref: '#/components/schemas/components-schemas-acquirerIdCode'
        transactionType:
          $ref: '#/components/schemas/transactionType'
        tags:
          $ref: '#/components/schemas/schemas-Tags'
        cardInfoSummary:
          $ref: '#/components/schemas/CardInfoSummary'
        interchangeFeeProgram:
          $ref: '#/components/schemas/PublicInterchangeFeeProgram'
        cashbackAmount:
          allOf:
          - description: 'The cashback amount, in minor units, included in the `netSettlementAmount`.

              For example `$12.34` is encoded as `1234`. Currently only potentially present for Visa and Mastercard.

              '
          - $ref: '#/components/schemas/openapi_components-schemas-Amount-2'
        transactionRegionalitySummary:
          $ref: '#/components/schemas/TransactionRegionalitySummary'
    VisaPublicDesignator:
      type: object
      description: 'Visa Public Designator

        '
      additionalProperties: false
      required:
      - network
      properties:
        network:
          type: string
          enum:
          - visa
        feeProgramIndicator:
          description: Fee Program Indicator as defined by Visa. This is a 3 character code indicating the Fee Program used. Fee Program Indicators are generally not used for Intra-European transactions.
          type: string
        feeDescriptor:
          description: Fee Descriptor as defined by Visa. This is a short alpha-numeric code indicating the Fee Program used.
          type: string
        feeProgramName:
          description: Human-readable description of the Fee Program.
          type: string
        cpsProgram:
          description: Short name (as defined by Silverflow) of the CPS Program. Custom Payment Service (CPS) Programs are mostly commonly used for US transactions.
          type: string

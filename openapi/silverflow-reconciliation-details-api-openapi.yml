    FirstChargebackSMSReconciliationDetail:
      allOf:
      - type: object
        required:
        - type
        - typeSpecific
        properties:
          type:
            type: string
            enum:
            - firstChargeback-sms
          typeSpecific:
            $ref: '#/components/schemas/FirstChargebackSMSSpecific'
      - $ref: '#/components/schemas/BaseReconciliationDetail'
    ArbitrationDMSReconciliationDetail:
      allOf:
      - type: object
        required:
        - type

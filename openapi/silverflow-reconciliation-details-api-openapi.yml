    transactionType:
      type: string
      enum:
      - purchase
      - refund
      - payout
      - funding
    schemas-Tags:
      type: object
      description: 'Optional tags provided by the agent to tag the object for maintainability. Tags can be used filtering and sorting on the list views of Disputes. A valid tag-key must:

        - contain only a-z, 0-9, "_" characters

        - first character should be a letter

        - be at least 1 character long

        - be no longer than 24 characters

        - not start with "sf_"

        '
      additionalProperties:
        type: string
        description: Value of the key. A valid value should match with /^.{1,100}$/
        pattern: ^.{1,100}$
      example:
        IamAKey: ThisIsaValue!
    acceptorKey:
      description: Uniquely identifies a Merchant Acceptor.
      type: string
      pattern: ^mac-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
      example: mac-1JRadf2ffdfrdPMf2XrS2
    preDisputeType:
      type: string
      description: The type of pre-dispute resolution used for this transaction.
      enum:

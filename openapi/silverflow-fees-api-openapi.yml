        target:
          $ref: '#/components/schemas/openapi_components-schemas-currencyCode-4'
        rate:
          description: Rate used to convert from source to target
          type: integer
          format: int32
        exponent:
          description: Indicates precision of the rate
          type: integer
          format: int32
        operation:
          type: string
          enum:

      description: 'An amount encoded as an object with a `value` in minor units and a `currency` code.

        '
      properties:
        value:
          $ref: '#/components/schemas/amountValueInteger'
        currency:
          $ref: '#/components/schemas/openapi_components-schemas-currencyCode-5'
    BaseFee:
      type: object
      required:

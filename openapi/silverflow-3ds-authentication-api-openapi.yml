      - threeDsPriorAuthenticationInfo
      - merchantInfo
      properties:
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfoRequest'
        card:
          $ref: '#/components/schemas/Card'
        threeRiIndicator:
          $ref: '#/components/schemas/ThreeRiIndicator'
        amount:
          $ref: '#/components/schemas/Amount'
        cardholderInformation:
          $ref: '#/components/schemas/CardholderInformation'
        billingAddress:
          description: The billing address of the cardholder
          $ref: '#/components/schemas/AddressInput'
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        threeDsPriorAuthenticationInfo:
          $ref: '#/components/schemas/ThreeDsPriorAuthenticationInfo'
        recurringExpiry:
          $ref: '#/components/schemas/ThreeRiRecurringExpiry'
        recurringFrequency:
          $ref: '#/components/schemas/ThreeRiRecurringFrequency'
        installmentTerms:
          $ref: '#/components/schemas/InstallmentTerms'
    messageCategory:
      type: string
      description: Indicates the category of the EMV 3-D Secure message.
    ThreeDsFrictionlessAuthenticatedWithoutAuthValue:
      type: object
      title: 3DS Frictionless Authenticated Without Authentication Value
      required:
      - key
      - amount
      - network
      - protocolVersion
      - deviceChannel
      - flow
      - result
      - ares
      - created
      - version
      properties:
        key:
          $ref: '#/components/schemas/threedsKey'
        merchantAcceptorRef:
          $ref: '#/components/schemas/schemas-AcceptorRef'
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfoResponse'
        amount:
          $ref: '#/components/schemas/ResponseAmount'
        network:
          $ref: '#/components/schemas/authenticationNetwork'
        protocolVersion:
          $ref: '#/components/schemas/protocolVersion'
        deviceChannel:
          $ref: '#/components/schemas/deviceChannel'
        flow:
          $ref: '#/components/schemas/frictionlessFlow'
        result:
          $ref: '#/components/schemas/frictionlessResult'
        ares:
          $ref: '#/components/schemas/AResWithoutAuthValue'
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        type:
          type: object
          description: Transaction type information from the request
          properties:
            order:
              $ref: '#/components/schemas/order'
            intent:
              $ref: '#/components/schemas/intent'
        created:
          $ref: '#/components/schemas/schemas-created'
        version:
          $ref: '#/components/schemas/version'
    acsSignedContent:
      type: string
      description: Contains the JWS object (represented as a string) created by the ACS for the ARes message.
      example: eyJhbGciOiJQUzI1NiIsIng1YyI6Ik1JSURlVENDQW1HZ0F3SUJ
      pattern: ^[a-zA-Z0-9()+,\-.:=@;$_!*\/?#|]*$
      minLength: 1
      maxLength: 2560
    ThreeRiRequestWithMerchantAcceptor:
      title: With Merchant Acceptor
      description: 'Initiate a 3RI authentication using an existing merchant acceptor.

        This requires prior onboarding of the merchant acceptor in the Silverflow system.

        '
      type: object
      additionalProperties: false
      required:
      - card
      - threeRiIndicator
      - amount
      - threeDsPriorAuthenticationInfo
      - merchantAcceptorResolver
      properties:
        merchantAcceptorResolver:
          $ref: '#/components/schemas/merchantAcceptorResolver'
        card:
          $ref: '#/components/schemas/Card'
        threeRiIndicator:
          $ref: '#/components/schemas/ThreeRiIndicator'
        amount:
          $ref: '#/components/schemas/Amount'
        cardholderInformation:
          $ref: '#/components/schemas/CardholderInformation'
        billingAddress:
          description: The billing address of the cardholder
          $ref: '#/components/schemas/AddressInput'
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        threeDsPriorAuthenticationInfo:
          $ref: '#/components/schemas/ThreeDsPriorAuthenticationInfo'
        recurringExpiry:
          $ref: '#/components/schemas/ThreeRiRecurringExpiry'
        recurringFrequency:
          $ref: '#/components/schemas/ThreeRiRecurringFrequency'
        installmentTerms:
          $ref: '#/components/schemas/InstallmentTerms'
    MessageExtension:
      type: object
      required:
      - name
      - id
      - criticalityIndicator
      - data
      properties:
        name:
          type: string
          example: msgextname
          pattern: ^[a-zA-Z0-9_\-\s]+$
          minLength: 1
          maxLength: 64
        id:
          type: string
          example: 501341592B_0001_4568
          pattern: ^[a-zA-Z0-9_\-]+$
          minLength: 1
          maxLength: 64
        criticalityIndicator:
          type: boolean
          example: false
        data: {}
    eci:
      type: string
      description: Payment system-specific value provided by the ACS or DS to indicate the results of the attempt to authenticate the Cardholder.
    authenticationMethod:
      type: string
      description: Authentication approach that the ACS used to authenticate the cardholder for this specific transaction.
    ThreeRiRecurringFrequency:
      type: integer
      description: 'Number of days between recurring authorizations.


        This property is required for `threeRiIndicator = "recurring"`, `"installment"`, or `"standing-order"`.


        For other cases, it will default to `1`, indicating that the frequency of payments is not specified.

        '
    expiryYear:
      type: integer
      description: 'The year the card expires including the century

        '
      minimum: 2020
      maximum: 2050
    ThreeDsCardRangesRequest:
      oneOf:
      - $ref: '#/components/schemas/ThreeDsCardRangesCardNumberRequest'
      - $ref: '#/components/schemas/ThreeDsCardRangesProcessorTokenRequest'
    ThreeDs:
      title: 3DS Entity
      oneOf:
      - $ref: '#/components/schemas/ThreeDsFrictionlessAuthenticated'
      - $ref: '#/components/schemas/ThreeDsChallenge'
      - $ref: '#/components/schemas/ThreeDsChallengeFinished'
      - $ref: '#/components/schemas/ThreeDsNoFlowNoAuth'
      - $ref: '#/components/schemas/ThreeRiResponse'
      - $ref: '#/components/schemas/ThreeDsDataOnly'
    notificationUrl:
      type: string
      description: 'URL that receives the challenge response (CRes) or error message from the issuer''s Access Control Server (ACS).

        '
      pattern: ^https://.{1,248}$
      example: https://myserver.com/send/callback/here
    AResWithoutAuthValue:
      type: object
      description: The issuer's response to the 3DS request.
      allOf:
      - $ref: '#/components/schemas/Message'
      - type: object
        required:
        - messageType
        - dsTransID
        - acsTransID
        - transStatus
        - dsReferenceNumber
        - acsReferenceNumber
        properties:
          messageType:
            type: string
            enum:
            - ARes
          dsTransID:
            $ref: '#/components/schemas/dsTransID'
          acsTransID:
            $ref: '#/components/schemas/acsTransID'
          transStatus:
            $ref: '#/components/schemas/transStatus'
          transStatusReason:
            $ref: '#/components/schemas/transStatusReason'
          cardholderInfo:
            $ref: '#/components/schemas/cardHolderInfo'
          acsChallengeMandated:
            $ref: '#/components/schemas/acsChallengeMandated'
          dsReferenceNumber:
            $ref: '#/components/schemas/dsReferenceNumber'
          acsReferenceNumber:
            $ref: '#/components/schemas/acsReferenceNumber'
          acsOperatorID:
            $ref: '#/components/schemas/acsOperatorID'
          acsDecConInd:
            $ref: '#/components/schemas/acsDecConInd'
          acsRenderingType:
            $ref: '#/components/schemas/acsRenderingType'
          acsURL:
            $ref: '#/components/schemas/acsUrl'
          authenticationType:
            $ref: '#/components/schemas/authenticationType'
          eci:
            $ref: '#/components/schemas/eci'
          whiteListStatus:
            $ref: '#/components/schemas/whiteListStatus'
          whiteListStatusSource:
            $ref: '#/components/schemas/whiteListStatusSource'
          acsSignedContent:
            $ref: '#/components/schemas/acsSignedContent'
    ThreeRiResponseWithoutAuthenticationValue:
      type: object
      title: 3RI Authentication Without Authentication Value
      required:
      - key
      - amount
      - network
      - protocolVersion
      - deviceChannel
      - result
      - ares
      - fraudLiability
      - created
      - version
      properties:
        key:
          $ref: '#/components/schemas/threedsKey'
        merchantAcceptorRef:
          $ref: '#/components/schemas/schemas-AcceptorRef'
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfoResponse'
        amount:
          $ref: '#/components/schemas/ResponseAmount'
        network:
          $ref: '#/components/schemas/authenticationNetwork'
        protocolVersion:
          type: string
          description: The 3DS protocol version which has been used to perform 3DS. For 3RI it's always 2.2.0
          enum:
          - 2.2.0
        deviceChannel:
          type: string
          description: Indicates the type of the interface used to initiate the transaction.
          enum:
          - 3ri
        result:
          $ref: '#/components/schemas/Result'
        ares:
          $ref: '#/components/schemas/ThreeRiAResWithoutAuthenticationValue'
        transactionReference:
          $ref: '#/components/schemas/transactionReference'
        fraudLiability:
          $ref: '#/components/schemas/fraudLiability'
        created:
          $ref: '#/components/schemas/schemas-created'
        version:
          $ref: '#/components/schemas/version'
    DynamicDescriptor:
      type: object
      minProperties: 1
      additionalProperties: false
      description: "Allows customizing the DBA name on a per-transaction basis, \nto help the cardholder recognize the business name on their card or bank statement.\n"
      properties:
        merchantName:
          type: string
          pattern: ^[a-zA-Z0-9-\.!\*=_ ]+$
          description: Recognizable business name that will appear on the customer's card or bank statement.
          example: Acme Inc.
          minLength: 1
          maxLength: 22
    AuthenticationContext:
      type: object
      description: 'Contains data that the issuer needs to perform the fingerprinting, but also optional configuration settings.

        '
      required:
      - notificationUrl
      - browserData
      properties:
        notificationUrl:
          $ref: '#/components/schemas/notificationUrl'
        browserData:
          type: object
          description: 'Information about the browser that is performing the transaction. This data is used by the issuer to perform fingerprinting.

            '
          oneOf:
          - $ref: '#/components/schemas/BrowserDataJavascriptEnabledTrue'
          - $ref: '#/components/schemas/BrowserDataJavascriptEnabledFalse'
    dsTransID:
      type: string
      description: Universally unique transaction identifier assigned by the DS to identify a single transaction.
      format: uuid
      pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
      example: c73bcdcc-2669-4bf6-81d3-e4ae73fb11fd
    ThreeRiRequest:
      oneOf:
      - $ref: '#/components/schemas/ThreeRiRequestWithMerchantAcceptor'
      - $ref: '#/components/schemas/ThreeRiRequestWithMerchantInfo'
    schemas-created:
      type: string
      description: The date and time this object was created
      format: iso-8601-date-time
    MerchantInfoResponse:
      type: object
      description: 'Merchant details as stored and returned in the response. The `merchantCountryCode` is returned

        as a complete ISO 3166-1 country code object containing all representations.

        '
      additionalProperties: false
      required:
      - merchantId
      - mcc
      - merchantName
      - merchantCountryCode
      - websiteUrl
      - network
      properties:
        acquirerBin:
          type: string
          description: '6-11 digit Bank Identification Number assigned by the card network. Required for all card networks except AMEX.

            For AMEX populate this with the SE Number or leave blank depending on the model, see 3DS Guide.

            '
          pattern: ^[0-9]+$
          minLength: 6
          maxLength: 11
        merchantId:
          type: string
          description: 'Merchant identifier (MID) assigned by the acquirer.

            For AMEX populate this with the Seller ID or SE Number depending on the model, see 3DS Guide.

            '
          minLength: 1
          maxLength: 20
        mcc:
          type: string
          description: 4-digit ISO 18245 merchant category code
          pattern: ^[0-9]+$
          minLength: 4
          maxLength: 4
        merchantName:
          type: string
          description: Merchant's doing-business-as name
        merchantCountryCode:
          allOf:
          - $ref: '#/components/schemas/schemas-CountryCodeAlpha3'
          - $ref: '#/components/schemas/schemas-CountryCodeAlpha2'
          - $ref: '#/components/schemas/schemas-CountryCodeNumeric'
        websiteUrl:
          type: string
          description: Merchant's website URL
          maxLength: 2048
        network:
          allOf:
          - description: The card network that will process the transaction and handle authentication.
          - $ref: '#/components/schemas/network'
    sdkTransID:
      type: string
      description: Universally unique transaction identifier assigned upon the activation of 3DS SDK.
      format: uuid
      pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
      example: 6357449a-b12b-4e81-b577-fee137273136
    ReferencedEntityNotFoundErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/referenced-entity-not-found
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Referenced Entity Not Found
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 409
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    browserLanguage:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^.+$
      description: 'Value representing the browser language as defined in IETF BCP47. Returned from `navigator.language` property from the HTML DOM API.

        '
      example: nl-NL
    schemas-acceptorKey:
      description: Uniquely identifies a merchant acceptor.
      type: string
      pattern: ^mac-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
      example: '{{acceptorKeyMastercard}}'
    UnsupportedCardNetworkRegionErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/3ds/unsupported-card-network-region
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Unsupported Region for this Card Network
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 409
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    ThreeDsChallengeFinishedWithoutAuthValue:

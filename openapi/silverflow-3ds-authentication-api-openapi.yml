    challengeIndicator:
      type: string
      description: "When set, indicates the preferred 3DS challenge flow as follows: \n  - `no-preference`: No preference related to the challenge flow.\n  - `no-challenge`: No challenge flow requested.\n  - `challenge-preferred`: Preferably a challenge flow takes place.\n  - `challenge-mandated`: The challenge flow must take place.\n  - `no-challenge-tra`: No challenge requested as transaction risk analysis is already performed.\n  - `no-challenge-low-value`: No challenge requested as low value exemption is applied. This exemption is only applicable for Mastercard.\n  - `no-challenge-scp`: No challenge requested as the secure corporate payment exemption is applied. This exemption is only applicable for Mastercard and Visa.\n  - `data-only`: For data sharing purposes only and therefore will never trigger a challenge flow.\n"
      enum:
      - no-preference
      - no-challenge
      - challenge-preferred
      - challenge-mandated
      - no-challenge-tra
      - no-challenge-low-value
      - no-challenge-scp
      - data-only
    authenticationNetwork:
      type: string
      description: 'The card network that was used for the authentication.

        It is `unknown` for entities older than 2024-04-11.

        '
      enum:
      - american-express
      - bancontact
      - diners
      - mastercard
      - visa
      - unknown
    frictionlessResult:
      allOf:
      - description: 'Indicates that the cardholder was successfully authenticated.

          '
        enum:
        - authenticated
      - $ref: '#/components/schemas/result'
    acsUrl:
      type: string
      description: 'The merchant or PSP needs to send the base64 encoded CReq message as a form to this URL using an HTTP POST, from the cardholder challenge window. The content type needs to be `application/x-www-form-urlencoded`.


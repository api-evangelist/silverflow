        dateTime:
          type: string
          format: iso-8601-date-time
          description: The date and time of the authentication.
        acsTransId:
          type: string
          description: The ACS (Access Control Server) transaction ID.
        dsTransId:
          type: string
          description: The DS (Directory Server) transaction ID.
    errorDetail:
      type: string
      description: 'A human readable explanation specific to this occurrence of the problem.

        '
    BrowserDataJavascriptEnabledTrue:
      allOf:
      - $ref: '#/components/schemas/BrowserData'
      - type: object
        required:
        - javascriptEnabled
        - screenWidth
        - screenHeight
        - timeZoneOffset
        - javaEnabled
        - colorDepth
        properties:
          javascriptEnabled:
            type: boolean
            description: The ability of the cardholder browser to execute JavaScript.
            enum:
            - true
          screenWidth:
            $ref: '#/components/schemas/browserScreenWidth'
          screenHeight:
            $ref: '#/components/schemas/browserScreenHeight'
          timeZoneOffset:
            $ref: '#/components/schemas/browserTimeZoneOffset'
          javaEnabled:
            $ref: '#/components/schemas/browserJavaEnabled'
          colorDepth:
            $ref: '#/components/schemas/browserColorDepth'
    acsChallengeMandated:
      type: string
      description: Indication of whether a challenge is required for the transaction to be authorized due to local/regional mandates or other variable.
    InternalServerErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/internal-server-error
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Internal Server Error
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 500
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    threeDsPage:
      allOf:
      - $ref: '#/components/schemas/schemas-Page'
      - type: object
        required:
        - threeDss
        properties:
          threeDss:
            type: array
            items:
              $ref: '#/components/schemas/ThreeDsPageEntity'
    acsTransID:
      type: string
      description: 'Universally unique transaction identifier assigned by the ACS to identify a single transaction. Each DS can provide a unique ID to each ACS on an individual basis.

        '
      example: d7c1ee99-9478-44a6-b1f2-391e29c6b340
      format: uuid
      pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
    UnsupportedCardNetworkErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/3ds/unsupported-card-network
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Unsupported Card Network
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 409
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    Message:
      type: object
      description: 'A 3DS protocol message as it is received by the card network.

        '
      required:
      - messageVersion
      - threeDSServerTransID
      properties:
        messageVersion:
          $ref: '#/components/schemas/activeProtocolVersion'
        threeDSServerTransID:
          $ref: '#/components/schemas/threeDSServerTransID'
        sdkTransID:
          $ref: '#/components/schemas/sdkTransID'
        messageExtension:
          $ref: '#/components/schemas/MessageExtensionList'
    ThreeRiTransStatus:
      type: string
      description: "Indicates whether a transaction is authenticated or not.\n  - `Y` indicates authenticated\n  - `N` indicates not authenticated\n  - `R` indicates rejected\n"
      enum:
      - Y
      - N
      - R
    CardByProcessorTokenKey:
      type: object
      title: Processor Token Key (EXPERIMENTAL)
      required:
      - processorTokenKey
      properties:
        processorTokenKey:
          $ref: '#/components/schemas/processorTokenKey'
        cvc:
          allOf:
          - description: 'The three digit CVC code of the card.

              If a CVC is provided here, it takes precedence over the one stored in the processor token.

              '
          - $ref: '#/components/schemas/cvc'
    result:
      description: Authentication result.
      type: string
    protocolVersion:
      type: string
      description: "The 3DS protocol version which has been used to perform 3DS.\n\n **Protocol version 2.1.0 is no longer supported by the card networks. The value 2.1.0 can be retrieved for older authentications.**\n"
      enum:
      - 2.1.0
      - 2.2.0
    pan:
      type: string
      description: Full digits of the card.
      pattern: ^[0-9]+$
      minLength: 13
      maxLength: 19
      format: password
      example: 1234123412341234
    errorTitle:
      type: string
      description: 'A short, human-readable summary of the problem type. It does not change from occurrence to occurrence of the error.

        '
    InputCard:
      type: object
      required:
      - number
      - expiryMonth
      - expiryYear

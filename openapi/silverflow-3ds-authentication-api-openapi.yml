    UnenrolledAccountNumberErrorDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/errorType'
          - enum:
            - /silverflow/problems/3ds/unenrolled-account-number
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Unenrolled Account Number
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 422
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    processorTokenKey:
      type: string
      description: The key to a card stored using [Processor Tokenization](#tag/Processor-Tokenization).
      pattern: ^ptk-[a-zA-Z0-9]+$
      minLength: 5
      maxLength: 120
    flow:
      description: Indicates the flow that was used for the 3DS authentication.
      type: string
    ThreeDsCardRangesResponse:
      type: object
      required:
      - network
      - startRange
      - endRange
      - acsStartProtocolVersion
      - acsEndProtocolVersion
      - dsStartProtocolVersion
      - dsEndProtocolVersion
      properties:
        network:
          $ref: '#/components/schemas/network'
        startRange:
          type: string
          description: Starting range of the PAN.
        endRange:
          type: string
          description: Ending range of the PAN.
        acsStartProtocolVersion:
          type: string
          description: ACS start protocol version.
        acsEndProtocolVersion:
          type: string
          description: ACS end protocol version.
        dsStartProtocolVersion:
          type: string
          description: DS start protocol version.
        dsEndProtocolVersion:
          type: string
          description: DS end protocol version.
        threeDSMethodURL:
          type: string
          description: 'URL to call from the iFrame to gather browser''s information.

            '
        threeDSServerTransID:
          type: string
          description: 'The `threeDSServerTransID` to use when executing the 3DS Method flow. Include this field in the 3DS authentication request if the 3DS Method has been executed.

            '
        acsInfoIndicator:
          type: array
          items:
            type: string
            enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - 08
            - 09
            - '10'
            - '11'
          description: "An array of ACS indicators that consist of the following values:\n  - 01 = Authentication Available at ACS\n  - 02 = Attempts Supported by ACS or DS\n  - 03 = Decoupled Authentication Supported\n  - 04 = Trust List Supported\n  - 05 = Device Binding Supported\n  - 06 = WebAuthn Authentication Supported\n  - 07 = SPC Authentication Supported\n  - 08 = Transaction Risk Analysis Exemption Supported\n  - 09 = Trust List Exemption Supported\n  - 10 = Low Value Exemption Supported\n  - 11 = Secure Corporate Payments Exemption Supported\n  - 12–79 = Reserved for EMVCo future use (values invalid until defined by EMVCo)\n  - 80–99 = Reserved for DS use\n"
    schemas-CountryCodeAlpha2:
      type: object
      title: alpha-2
      required:
      - alpha2
      properties:
        alpha2:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code
          externalDocs:
            description: Find more info here
            url: https://www.iso.org/iso-3166-country-codes.html
          example: NL
    browserIP:
      type: string
      pattern: (^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)|(^(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:))$)
      description: 'IP address of the browser as returned by the HTTP headers. Shall be included where regionally acceptable. Example IPv6 address: 2011:0db8:85a3:0101:0101:8a2e:0370:7334.

        '
      example: 1.12.123.255
    InstallmentTerms:
      type: integer
      description: 'Maximum number of authorizations for an installment payment.


        Required for and only allowed when `threeRiIndicator = "installment"`. Must be greater than 1 and at most 3 digits (max value 999).

        '
      minimum: 2
      maximum: 999
    transactionReference:
      type: string
      description: 'Unique ID assigned by the merchant or payment service provider for the transaction. Used to identify the transaction.

        '
      pattern: ^[a-zA-Z0-9()+,\-.:=@;$_!*\/?|]+$
      minLength: 1
      maxLength: 120
      example: Dz3dIzE74EfH1HeTInyE
    ThreeRiResponse:

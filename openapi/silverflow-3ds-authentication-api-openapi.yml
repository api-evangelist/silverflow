      - protocolVersion
      - deviceChannel
      - flow
      - result
      - ares
      - created
      - version
      properties:
        key:
          $ref: '#/components/schemas/threedsKey'
        merchantAcceptorRef:
          $ref: '#/components/schemas/schemas-AcceptorRef'
        merchantInfo:
          $ref: '#/components/schemas/MerchantInfoResponse'
        amount:
          $ref: '#/components/schemas/ResponseAmount'
        network:
          $ref: '#/components/schemas/authenticationNetwork'
        protocolVersion:
          $ref: '#/components/schemas/protocolVersion'
        deviceChannel:
          $ref: '#/components/schemas/deviceChannel'
        flow:
          allOf:
          - enum:
            - challenge
          - $ref: '#/components/schemas/flow'
        result:
          allOf:
          - description: 'Indicates that the cardholder has to complete the challenge flow.

              '

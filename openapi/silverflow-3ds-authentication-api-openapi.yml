      - amount
      - network
      - deviceChannel
      - result
      - ares
      - fraudLiability
      - threeRiIndicator
      - created
      - version
      properties:
        key:
          $ref: '#/components/schemas/threedsKey'
        merchantAcceptorRef:
          $ref: '#/components/schemas/schemas-AcceptorRef'

          $ref: '#/components/schemas/expiryMonth'
        expiryYear:
          $ref: '#/components/schemas/expiryYear'
        cvc:
          $ref: '#/components/schemas/cvc'
        holderName:
          $ref: '#/components/schemas/holderName'
    fraudLiability:
      description: Which party is liable in case of fraud.
      type: string
      enum:
      - acquirer
      - issuer
    ThreeRiIndicator:
      type: string
      description: Indicates the type of 3RI request. This property provides additional information to the ACS to determine the best approach for handling a 3RI request.
      enum:
      - recurring
      - ucof
      - installment
      - standing-order
    PublicCreate3dsRequest:
      oneOf:
      - $ref: '#/components/schemas/PublicCreate3dsRequestWithMerchantAcceptor'
      - $ref: '#/components/schemas/PublicCreate3dsRequestWithMerchantInfo'
    browserAcceptHeader:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^.+$
      description: 'Exact content of the HTTP accept headers as sent to the 3DS Requestor from the cardholder''s browser.

        '
      example: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    browserUserAgent:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^.+$
      description: 'Exact content of the HTTP user-agent header.

        '
      example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.110 Safari/537.36
    schemas-lastModified:
      type: string
      description: The date and time this object was last modified.
      format: iso-8601-date-time
    browserTimeZoneOffset:
      type: string
      minLength: 1
      maxLength: 5
      pattern: ^.+$
      description: "Time-zone offset in minutes between UTC and the cardholder browser local time.\nValue is returned from the `getTimezoneOffset()` method. Note that the offset is positive if the local\ntime zone is behind UTC and negative if it is ahead. \n\nExample: If UTC -5 hours: 300 -> +300, if UTC +5 hours: -> -300\n"
      example: '0'
    components-schemas-city:
      type: string
      pattern: ^(?!\s*$).+
      minLength: 1
      maxLength: 50
      description: 'The city of the address.

        '
      example: Amsterdam
    RReq:
      type: object
      description: 'This property is only present after the cardholder finished the challenge flow.


        The RReq message communicates the results of the authentication or verification.

        This message is received by Silverflow from the issuer (through the scheme) and contains the result of a challenge flow.


        Once Silverflow received the CReq, it will be appended to the 3DS entity it belongs to and the result can be interpreted by the requester.'
      allOf:
      - $ref: '#/components/schemas/Message'
      - type: object
        required:
        - messageType
        - acsTransID
        - dsTransID
        - interactionCounter
        - messageCategory
        - transStatus
        properties:
          messageType:
            type: string
            enum:
            - RReq
          acsTransID:
            $ref: '#/components/schemas/acsTransID'
          acsRenderingType:
            $ref: '#/components/schemas/acsRenderingType'
          authenticationMethod:
            $ref: '#/components/schemas/authenticationMethod'
          authenticationType:
            $ref: '#/components/schemas/authenticationType'
          challengeCancel:
            $ref: '#/components/schemas/challengeCancel'
          dsTransID:
            $ref: '#/components/schemas/dsTransID'
          eci:
            $ref: '#/components/schemas/eci'
          interactionCounter:
            $ref: '#/components/schemas/interactionCounter'
          messageCategory:
            $ref: '#/components/schemas/messageCategory'
          transStatus:
            $ref: '#/components/schemas/transStatus'
          transStatusReason:
            $ref: '#/components/schemas/transStatusReason'
          whiteListStatus:
            $ref: '#/components/schemas/whiteListStatus'
          whiteListStatusSource:
            $ref: '#/components/schemas/whiteListStatusSource'
          authenticationValue:
            $ref: '#/components/schemas/authenticationValue'
    challengeCancel:
      type: string

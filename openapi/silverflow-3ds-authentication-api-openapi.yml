      description: Uniquely identifies a merchant acceptor.
      type: string
      pattern: ^mac-[a-zA-Z0-9]+$
      example: mac-25oJsQ99GBpW23MQidKS
    acsDecConInd:
      type: string
      description: Indicates whether the ACS confirms utilisation of decoupled authentication and agrees to utilize decoupled authentication to authenticate the cardholder.
    network:
      type: string
      description: 'The card network to query for PAN information.


        Diners support is <a class="experimental-tag-link" href="https://docs.silverflow.com/guides/api-lifecycle#tag/EXPERIMENTAL-Tag"><span class="tag experimental-tag">EXPERIMENTAL</span></a>.

        '
      enum:
      - american-express
      - bancontact
      - diners
      - mastercard
      - visa
    BrowserData:
      type: object
      required:
      - acceptHeader
      - language
      - userAgent
      properties:
        acceptHeader:
          $ref: '#/components/schemas/browserAcceptHeader'
        language:
          $ref: '#/components/schemas/browserLanguage'
        userAgent:
          $ref: '#/components/schemas/browserUserAgent'
        browserIP:
          $ref: '#/components/schemas/browserIP'
    Result:
      type: string
      description: Authentication result.
      enum:
      - authenticated
      - non-authenticated
    components-schemas-stateOrProvince:
      type: string
      pattern: ^(?!\s*$).+
      minLength: 1
      maxLength: 3
      description: 'The state (US) or province (non-US) of the address.

        '

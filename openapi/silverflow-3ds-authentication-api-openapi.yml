            - /silverflow/problems/invalid-offset-token
        title:
          allOf:
          - $ref: '#/components/schemas/errorTitle'
          - enum:
            - Invalid Offset Token
        status:
          allOf:
          - $ref: '#/components/schemas/errorStatus'
          - enum:
            - 400
        detail:
          $ref: '#/components/schemas/errorDetail'
        instance:
          $ref: '#/components/schemas/errorInstance'
    acsOperatorID:
      type: string
      description: DS assigned ACS identifier.
    noAuthFlow:
      allOf:
      - enum:
        - none
      - $ref: '#/components/schemas/flow'
    errorType:
      type: string
      description: 'A relative URI reference, this property can be used to perform automated error handling.

        '
    whiteListStatusSource:
      type: string
      description: This data element will be populated by the system setting Whitelist Status. Required if Whitelist Status is present.
    ThreeDsPriorAuthenticationInfo:
      type: object
